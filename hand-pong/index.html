<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Pong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #fff7d6;
    --yellow: #ffd93d;
    --pink: #ff6b9d;
    --cyan: #4ddbff;
    --lime: #9bf06b;
    --comic: 'Bangers', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', cursive;
    --round: 'Fredoka', 'Segoe UI Emoji', 'Apple Color Emoji', system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; font-family: var(--round); }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  video { display: none; }

  /* ---- Scoreboard ---- */
  #score {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%) rotate(-1.5deg);
    display: flex; align-items: center; gap: 14px; user-select: none; pointer-events: none;
    font: 400 34px var(--comic); letter-spacing: 1.5px; color: var(--ink);
    background: var(--paper); border: 3px solid var(--ink); border-radius: 16px;
    box-shadow: 5px 5px 0 var(--ink); padding: 4px 18px;
  }
  #score .who { font-size: 18px; opacity: .7; }
  #score .num { min-width: 28px; text-align: center; }
  #score .num.bump { animation: bump .35s cubic-bezier(.34,1.56,.64,1); }
  #score .vs { color: var(--pink); }

  #handBadge {
    position: fixed; top: 78px; left: 50%; transform: translateX(-50%);
    pointer-events: none; user-select: none; white-space: nowrap;
  }
  #handStatus {
    display: inline-block; padding: 4px 12px; border: 3px solid var(--ink); border-radius: 999px;
    background: #fff; font-weight: 600; font-size: 13px; color: var(--ink); box-shadow: 3px 3px 0 var(--ink);
  }
  #handStatus.on { background: var(--lime); }
  #handBadge[hidden] { display: none; }

  /* ---- Corner buttons ---- */
  #corner { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--ink);
    background: var(--cyan); font-size: 17px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink);
    font-family: var(--round); transition: transform .15s;
  }
  .icon-btn:hover { transform: rotate(12deg) scale(1.1); }
  .icon-btn:active { transform: translate(3px, 3px); box-shadow: none; }

  /* ---- Overlay screens (start / pause / game over) ---- */
  .screen {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink);
    background:
      radial-gradient(circle, rgba(26,26,46,.12) 2px, transparent 2.5px) 0 0 / 16px 16px,
      var(--yellow);
  }
  .screen.see-through { background: rgba(26,26,46,.55); }
  .screen[hidden] { display: none; }
  .card {
    background: var(--paper); border: 4px solid var(--ink); border-radius: 22px;
    box-shadow: 8px 8px 0 var(--ink); padding: 26px 30px; max-width: min(420px, calc(100vw - 64px));
    animation: popIn .45s cubic-bezier(.34,1.56,.64,1);
  }
  .screen h1 {
    margin: 0 0 18px; font: 400 clamp(52px, 11vw, 110px)/0.9 var(--comic);
    letter-spacing: 3px; color: #fff; -webkit-text-stroke: 3px var(--ink);
    text-shadow: 6px 6px 0 var(--pink), 9px 9px 0 var(--ink); transform: rotate(-4deg);
  }
  .card h2 {
    margin: 0 0 6px; font: 400 48px/1 var(--comic); letter-spacing: 2px; color: var(--yellow);
    -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 var(--ink);
  }
  .screen p { margin: 10px 0 0; font-size: 15px; font-weight: 500; }
  .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .comic-btn {
    font: 400 24px var(--comic); letter-spacing: 1px; color: var(--ink);
    background: var(--cyan); border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 4px 4px 0 var(--ink); padding: 8px 20px; cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .comic-btn:hover { transform: translate(-1px, -1px) rotate(-2deg); box-shadow: 5px 5px 0 var(--ink); }
  .comic-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  .comic-btn.pink { background: var(--pink); }
  .tip { font-size: 13px !important; opacity: .75; }
  kbd {
    font: 600 12px var(--round); background: #fff; border: 2px solid var(--ink);
    border-radius: 6px; padding: 0 5px; box-shadow: 1px 1px 0 var(--ink);
  }

  @keyframes popIn { from { transform: scale(.3) rotate(-12deg); opacity: 0; } }
  @keyframes bump { 40% { transform: scale(1.6) rotate(-8deg); color: var(--pink); } }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="game"></canvas>

<div id="score">
  <span class="who">CPU</span><span class="num" id="cpuScore">0</span>
  <span class="vs">:</span>
  <span class="num" id="youScore">0</span><span class="who">YOU</span>
</div>
<div id="handBadge" hidden><span id="handStatus">⏳ Loading hand tracker…</span></div>

<div id="corner">
  <button class="icon-btn" id="pauseBtn" title="Pause (P)">⏸️</button>
  <button class="icon-btn" id="muteBtn" title="Sound (M)">🔊</button>
</div>

<div class="screen" id="startScreen">
  <div>
    <h1>HAND<br>PONG!</h1>
    <div class="buttons">
      <button class="comic-btn pink" id="playHand">🖐️ Play with my hand</button>
      <button class="comic-btn" id="playMouse">🖱️ Use the mouse</button>
    </div>
    <p>First to 7 wins. Your paddle is on the right.</p>
    <p class="tip">Hand mode uses your camera. Nothing leaves your device.</p>
  </div>
</div>

<div class="screen see-through" id="pauseScreen" hidden>
  <div class="card">
    <h2>PAUSED</h2>
    <div class="buttons"><button class="comic-btn pink" id="resumeBtn">▶️ Keep going</button></div>
    <p class="tip"><kbd>P</kbd> pause · <kbd>M</kbd> sound</p>
  </div>
</div>

<div class="screen see-through" id="overScreen" hidden>
  <div class="card">
    <h2 id="overTitle">YOU WIN!</h2>
    <p id="overText"></p>
    <div class="buttons"><button class="comic-btn pink" id="againBtn">🔁 Play again</button></div>
  </div>
</div>

<script type="module">
const video = document.getElementById('video');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const handBadge = document.getElementById('handBadge');
const handStatus = document.getElementById('handStatus');

const WIN_SCORE = 7;
const COLORS = { ink: '#1a1a2e', paper: '#fff7d6', yellow: '#ffd93d', pink: '#ff6b9d', cyan: '#4ddbff', lime: '#9bf06b' };
const HIT_WORDS = ['POW!', 'BAM!', 'ZAP!', 'BOOM!', 'WHAM!', 'BOINK!'];

let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
let mode = null;              // 'hand' | 'mouse'
let state = 'start';          // 'start' | 'play' | 'serve' | 'paused' | 'over'
let muted = false;

const player = { y: 0, targetY: 0, squash: 0 };
const cpu = { y: 0, squash: 0, error: 0 };
const ball = { x: 0, y: 0, vx: 0, vy: 0, trail: [] };
const score = { you: 0, cpu: 0 };
let particles = [];
let popups = [];
let shake = 0;
let serveTimer = 0;
let serveDir = 1;
let rally = 0;

// ---- Sizes scale with the screen so it plays the same everywhere ----
const size = {
  get paddleW() { return Math.max(18 * dpr, W * 0.02); },
  get paddleH() { return H * 0.2; },
  get margin() { return Math.max(24 * dpr, W * 0.035); },
  get ballR() { return Math.max(8 * dpr, H * 0.017); },
  get baseSpeed() { return W * 0.5; },
  get maxSpeed() { return W * 1.3; },
};

function resize() {
  const oldH = H || 1;
  W = Math.floor(innerWidth * dpr);
  H = Math.floor(innerHeight * dpr);
  canvas.width = W; canvas.height = H;
  player.y *= H / oldH; player.targetY *= H / oldH; cpu.y *= H / oldH;
  if (state === 'start') resetPositions();
}
addEventListener('resize', resize);
resize();

function resetPositions() {
  player.y = player.targetY = cpu.y = H / 2;
  ball.x = W / 2; ball.y = H / 2; ball.vx = ball.vy = 0; ball.trail = [];
}

// ---- Sound: tiny synth blips, no files needed ----
let audio = null;
function blip(freq, dur = 0.08, type = 'square', vol = 0.08) {
  if (muted) return;
  audio ??= new AudioContext();
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq * 0.6, audio.currentTime + dur);
  g.gain.setValueAtTime(vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
  o.connect(g).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur);
}

// ---- Game flow ----
function newGame() {
  score.you = score.cpu = 0;
  updateScore();
  resetPositions();
  serve(Math.random() < 0.5 ? 1 : -1);
}

function serve(dir) {
  state = 'serve';
  serveDir = dir;
  serveTimer = 0.8;
  rally = 0;
  ball.x = W / 2; ball.y = H / 2; ball.vx = ball.vy = 0; ball.trail = [];
}

function launch() {
  const angle = (Math.random() - 0.5) * 0.8;
  ball.vx = Math.cos(angle) * size.baseSpeed * serveDir;
  ball.vy = Math.sin(angle) * size.baseSpeed;
  state = 'play';
  blip(520, 0.06, 'triangle');
}

function point(winner) {
  score[winner]++;
  updateScore(winner);
  shake = 18 * dpr;
  burst(ball.x < W / 2 ? 0 : W, ball.y, winner === 'you' ? COLORS.lime : COLORS.pink, 40);
  popup(winner === 'you' ? 'NICE!' : 'OOF!', W / 2, H / 2, winner === 'you' ? COLORS.lime : COLORS.pink, 1.6);
  blip(winner === 'you' ? 880 : 180, 0.25, winner === 'you' ? 'triangle' : 'sawtooth', 0.1);

  if (score[winner] >= WIN_SCORE) {
    state = 'over';
    const youWon = winner === 'you';
    document.getElementById('overTitle').textContent = youWon ? 'YOU WIN! 🏆' : 'CPU WINS 😵';
    document.getElementById('overText').textContent = youWon
      ? `${score.you} : ${score.cpu}. The robot is crying in binary.`
      : `${score.cpu} : ${score.you}. Rematch? It got lucky.`;
    setTimeout(() => (document.getElementById('overScreen').hidden = false), 600);
    return;
  }
  // The side that lost the point receives the next serve
  serve(winner === 'you' ? -1 : 1);
}

function updateScore(bumped) {
  const you = document.getElementById('youScore'), cpuEl = document.getElementById('cpuScore');
  you.textContent = score.you;
  cpuEl.textContent = score.cpu;
  const el = bumped === 'you' ? you : bumped === 'cpu' ? cpuEl : null;
  if (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}

function setPaused(p) {
  if (state === 'start' || state === 'over') return;
  if (p && state !== 'paused') { pausedFrom = state; state = 'paused'; }
  else if (!p && state === 'paused') state = pausedFrom;
  document.getElementById('pauseScreen').hidden = state !== 'paused';
}
let pausedFrom = 'play';

// ---- Effects ----
function burst(x, y, color, n = 16) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (100 + Math.random() * 420) * dpr;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, max: 0.9, color, r: (2 + Math.random() * 4) * dpr });
  }
}
function popup(text, x, y, color, scale = 1) {
  popups.push({ text, x, y, color, life: 0.8, scale, rot: (Math.random() - 0.5) * 0.4 });
}

// ---- Physics ----
function paddleRect(side) {
  const pw = size.paddleW, ph = size.paddleH;
  const x = side === 'you' ? W - size.margin - pw : size.margin;
  const y = (side === 'you' ? player.y : cpu.y) - ph / 2;
  return { x, y, w: pw, h: ph };
}

function hitPaddle(side) {
  const p = paddleRect(side), r = size.ballR;
  const movingToward = side === 'you' ? ball.vx > 0 : ball.vx < 0;
  if (!movingToward) return false;
  if (ball.x + r < p.x || ball.x - r > p.x + p.w) return false;
  if (ball.y + r < p.y || ball.y - r > p.y + p.h) return false;

  // Where on the paddle it hit decides the bounce angle (edges = steep)
  const rel = Math.max(-1, Math.min(1, (ball.y - (p.y + p.h / 2)) / (p.h / 2)));
  const angle = rel * (Math.PI / 3);
  const speed = Math.min(size.maxSpeed, Math.hypot(ball.vx, ball.vy) * 1.07);
  const dir = side === 'you' ? -1 : 1;
  ball.vx = Math.cos(angle) * speed * dir;
  ball.vy = Math.sin(angle) * speed;
  ball.x = side === 'you' ? p.x - r : p.x + p.w + r;

  rally++;
  shake = Math.min(14, 4 + rally) * dpr;
  (side === 'you' ? player : cpu).squash = 1;
  burst(ball.x, ball.y, side === 'you' ? COLORS.cyan : COLORS.pink);
  if (side === 'you' || rally % 3 === 0) {
    popup(HIT_WORDS[Math.floor(Math.random() * HIT_WORDS.length)], ball.x + dir * 60 * dpr, ball.y - 30 * dpr, side === 'you' ? COLORS.yellow : COLORS.pink);
  }
  blip(side === 'you' ? 660 : 440, 0.07);
  // Give the CPU a fresh, slightly wrong idea of where to aim next time
  if (side === 'you') cpu.error = (Math.random() - 0.5) * size.paddleH * (0.9 - Math.min(rally, 10) * 0.04);
  return true;
}

function update(dt) {
  // Player paddle eases toward the hand / mouse
  const half = size.paddleH / 2;
  player.targetY = Math.max(half, Math.min(H - half, player.targetY));
  player.y += (player.targetY - player.y) * Math.min(1, dt * 18);

  // CPU tracks the ball when it's coming, drifts home when it isn't
  const cpuSpeed = H * (0.75 + Math.min(score.you, 6) * 0.06);
  const goal = ball.vx < 0 ? ball.y + cpu.error : H / 2;
  const diff = goal - cpu.y;
  cpu.y += Math.sign(diff) * Math.min(Math.abs(diff), cpuSpeed * dt);
  cpu.y = Math.max(half, Math.min(H - half, cpu.y));

  player.squash = Math.max(0, player.squash - dt * 5);
  cpu.squash = Math.max(0, cpu.squash - dt * 5);

  if (state === 'serve') {
    serveTimer -= dt;
    if (serveTimer <= 0) launch();
  }

  if (state === 'play') {
    // Sub-steps stop a fast ball from tunnelling through a paddle
    const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / (size.ballR * 0.8));
    const sdt = dt / steps;
    for (let i = 0; i < steps && state === 'play'; i++) {
      ball.x += ball.vx * sdt;
      ball.y += ball.vy * sdt;
      const r = size.ballR;
      if (ball.y < r && ball.vy < 0) { ball.y = r; ball.vy *= -1; blip(300, 0.04, 'triangle', 0.05); }
      if (ball.y > H - r && ball.vy > 0) { ball.y = H - r; ball.vy *= -1; blip(300, 0.04, 'triangle', 0.05); }
      hitPaddle('you') || hitPaddle('cpu');
      if (ball.x < -r * 2) point('you');
      else if (ball.x > W + r * 2) point('cpu');
    }
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 12) ball.trail.shift();
  }

  particles = particles.filter(p => {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93;
    return p.life > 0;
  });
  popups = popups.filter(p => (p.life -= dt) > 0);
  shake *= Math.pow(0.002, dt);
}

// ---- Drawing ----
function drawBackground() {
  if (mode === 'hand' && video.readyState >= 2) {
    // Mirrored camera so moving your hand up moves the paddle up, like a mirror
    const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh);
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, (W - vw * s) / 2, (H - vh * s) / 2, vw * s, vh * s);
    ctx.restore();
    ctx.fillStyle = 'rgba(26, 26, 46, 0.62)';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = COLORS.ink;
    ctx.fillRect(0, 0, W, H);
  }
  // Halftone dots
  ctx.fillStyle = 'rgba(255, 247, 214, 0.06)';
  const gap = 18 * dpr;
  for (let y = gap / 2; y < H; y += gap)
    for (let x = gap / 2; x < W; x += gap) ctx.fillRect(x, y, 2 * dpr, 2 * dpr);

  // Dashed centre line
  ctx.strokeStyle = 'rgba(255, 247, 214, 0.35)';
  ctx.lineWidth = 4 * dpr;
  ctx.setLineDash([16 * dpr, 16 * dpr]);
  ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  ctx.setLineDash([]);
}

function drawPaddle(side) {
  const p = paddleRect(side);
  const sq = (side === 'you' ? player : cpu).squash;
  const w = p.w * (1 + sq * 0.6), h = p.h * (1 - sq * 0.12);
  const x = p.x + p.w / 2 - w / 2, y = p.y + p.h / 2 - h / 2;
  const off = 5 * dpr;
  ctx.fillStyle = COLORS.ink;
  roundRect(x + off, y + off, w, h, w / 2); ctx.fill();
  ctx.fillStyle = side === 'you' ? COLORS.cyan : COLORS.pink;
  ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 3 * dpr;
  roundRect(x, y, w, h, w / 2); ctx.fill(); ctx.stroke();
}

function drawBall() {
  const r = size.ballR;
  ball.trail.forEach((t, i) => {
    const a = i / ball.trail.length;
    ctx.fillStyle = `rgba(255, 217, 61, ${a * 0.45})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, r * (0.4 + a * 0.6), 0, Math.PI * 2); ctx.fill();
  });
  // Squash and stretch in the direction of travel
  const speed = Math.hypot(ball.vx, ball.vy);
  const stretch = 1 + Math.min(0.5, speed / size.maxSpeed * 0.5);
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(Math.atan2(ball.vy, ball.vx));
  ctx.scale(stretch, 1 / stretch);
  ctx.fillStyle = COLORS.ink;
  ctx.beginPath(); ctx.arc(3 * dpr, 3 * dpr, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = COLORS.yellow; ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 3 * dpr;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawEffects() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    const t = 1 - p.life / 0.8;
    const s = p.scale * (t < 0.2 ? t / 0.2 * 1.2 : 1.2 - (t - 0.2) * 0.25);
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life / 0.3);
    ctx.translate(p.x, p.y - t * 30 * dpr);
    ctx.rotate(p.rot);
    ctx.scale(s, s);
    ctx.font = `${40 * dpr}px Bangers, cursive`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 8 * dpr; ctx.strokeStyle = COLORS.ink;
    ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
}

function drawServeCountdown() {
  if (state !== 'serve') return;
  ctx.save();
  ctx.font = `${30 * dpr}px Bangers, cursive`;
  ctx.textAlign = 'center';
  ctx.fillStyle = COLORS.paper;
  ctx.fillText(serveDir > 0 ? 'HEADING YOUR WAY →' : '← CPU SERVES', W / 2, H / 2 + size.ballR + 40 * dpr);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
}

function render() {
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  drawPaddle('cpu');
  drawPaddle('you');
  if (state !== 'start') drawBall();
  drawEffects();
  drawServeCountdown();
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  trackHand();
  if (state !== 'paused' && state !== 'start') update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- Mouse / touch control ----
addEventListener('pointermove', e => { if (mode === 'mouse') player.targetY = e.clientY * dpr; });
addEventListener('pointerdown', e => { if (mode === 'mouse') player.targetY = e.clientY * dpr; });

// ---- Hand control (MediaPipe) ----
let hands = null;
let lastVideoTime = -1;
let lastHandSeen = 0;
let shownStatus = '';
function setStatus(text) {
  if (text === shownStatus) return;
  shownStatus = text;
  handStatus.textContent = text;
  handStatus.classList.toggle('on', /moving|ready/i.test(text));
}

async function loadHands() {
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const options = delegate => ({
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate,
      },
      runningMode: 'VIDEO',
      numHands: 1,
      minHandDetectionConfidence: 0.3,
      minHandPresenceConfidence: 0.3,
      minTrackingConfidence: 0.3,
    });
    try { hands = await vision.HandLandmarker.createFromOptions(fileset, options('GPU')); }
    catch { hands = await vision.HandLandmarker.createFromOptions(fileset, options('CPU')); }
    setStatus('🖐️ Hand ready! Move it up and down');
  } catch (err) {
    console.warn(err);
    setStatus('🖱️ No hand tracking, switched to mouse');
    mode = 'mouse';
  }
}

function trackHand() {
  if (mode !== 'hand' || !hands || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = hands.detectForVideo(video, performance.now());
  const lm = res.landmarks?.[0];
  if (lm) {
    // Middle-finger knuckle = steady centre of the palm. Map the middle 80%
    // of the camera to the full court so you don't have to reach the edges.
    const vh = video.videoHeight, vw = video.videoWidth, s = Math.max(W / vw, H / vh);
    const y = (H - vh * s) / 2 + lm[9].y * vh * s;
    player.targetY = (y / H - 0.1) / 0.8 * H;
    lastHandSeen = performance.now();
    setStatus('🖐️ Moving!');
  } else if (performance.now() - lastHandSeen > 1000) {
    setStatus('👀 Where did your hand go?');
  }
}

// ---- Buttons & keys ----
async function start(chosen) {
  mode = chosen;
  if (mode === 'hand') {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      video.srcObject = stream;
      await video.play();
      handBadge.hidden = false;
      loadHands();
    } catch (err) {
      mode = 'mouse';
      handBadge.hidden = false;
      setStatus('📷 Camera blocked, using the mouse');
    }
  }
  document.getElementById('startScreen').hidden = true;
  blip(660, 0.1, 'triangle');
  newGame();
}

document.getElementById('playHand').addEventListener('click', () => start('hand'));
document.getElementById('playMouse').addEventListener('click', () => start('mouse'));
document.getElementById('againBtn').addEventListener('click', () => {
  document.getElementById('overScreen').hidden = true;
  newGame();
});
document.getElementById('pauseBtn').addEventListener('click', () => setPaused(state !== 'paused'));
document.getElementById('resumeBtn').addEventListener('click', () => setPaused(false));

function toggleMute() {
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
}
document.getElementById('muteBtn').addEventListener('click', toggleMute);

addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') setPaused(state !== 'paused');
  if (e.key === 'm' || e.key === 'M') toggleMute();
});
// Pause automatically when you switch tabs
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
</script>
