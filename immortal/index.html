}

function drawFar() {
  ctx.fillStyle = '#5c5c5c';
  const off = camX * 0.15;
  for (const b of FAR) {
    const x = b.x - off;
    if (x + b.w < 0 || x > VW) continue;
    ctx.fillRect(x, GROUND - b.h - 40, b.w, b.h + 40);
  }
}

function drawMid() {
  const off = camX * 0.45;
  for (const o of MID) {
    const x = o.x - off;
    if (x + o.w < -60 || x > VW + 60) continue;
    drawProp(o, x);
  }
  // Mantis' tower, with one lit window
  const tx = MANTIS_X * 0.45 + 120 - off;
  if (tx > -200 && tx < VW + 200) {
    ctx.fillStyle = '#262626';
    ctx.fillRect(tx, GROUND - 330, 110, 330);
    ctx.beginPath(); ctx.moveTo(tx - 10, GROUND - 330); ctx.lineTo(tx + 55, GROUND - 410); ctx.lineTo(tx + 120, GROUND - 330); ctx.fill();
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(tx + 44, GROUND - 290, 22, 30);
  }
  // Haze where the city meets the ground
  const g = ctx.createLinearGradient(0, GROUND - 150, 0, GROUND);
  g.addColorStop(0, 'rgba(190,190,190,0)'); g.addColorStop(1, 'rgba(190,190,190,0.14)');
  ctx.fillStyle = g; ctx.fillRect(0, GROUND - 150, VW, 150);
}

function drawProp(o, x) {
  const base = GROUND;
  ctx.fillStyle = '#363636'; ctx.strokeStyle = '#363636';
  switch (o.kind) {
    case 'tree': {
      ctx.lineWidth = 6; ctx.lineCap = 'round';
      const tx = x + o.w / 2;
      ctx.beginPath(); ctx.moveTo(tx, base); ctx.lineTo(tx, base - o.h); ctx.stroke();
      ctx.lineWidth = 3;
      for (let i = 0; i < 4; i++) {
        const by = base - o.h * (0.5 + i * 0.13), dir = i % 2 ? 1 : -1;
        ctx.beginPath(); ctx.moveTo(tx, by); ctx.lineTo(tx + dir * (20 + o.seed * 20), by - 22); ctx.stroke();
      }
      break;
    }
    case 'fence':
      for (let i = 0; i <= o.w; i += 16) ctx.fillRect(x + i, base - 38, 4, 38);
      ctx.fillRect(x, base - 30, o.w, 3); ctx.fillRect(x, base - 16, o.w, 3);
      break;
    case 'stall':
      ctx.fillRect(x, base - 60, o.w, 60);
      ctx.fillStyle = '#2c2c2c';
      ctx.beginPath(); ctx.moveTo(x - 10, base - 60); ctx.lineTo(x + o.w / 2, base - 90); ctx.lineTo(x + o.w + 10, base - 60); ctx.fill();
      ctx.fillStyle = '#444';
      for (let i = 0; i < o.w; i += 18) ctx.fillRect(x + i, base - 60, 9, 8);
      break;
    case 'house':
      ctx.fillRect(x, base - o.h, o.w, o.h);
      for (let wy = base - o.h + 14; wy < base - 20; wy += 26)
        for (let wx = x + 10; wx < x + o.w - 14; wx += 22) {
          ctx.fillStyle = ((wx * 7 + wy * 3) | 0) % 5 === 0 ? '#a0a0a0' : '#2a2a2a';
          ctx.fillRect(wx, wy, 9, 12);
        }
      break;
    case 'pylon':
      ctx.fillRect(x + o.w / 2 - 6, base - o.h - 80, 12, o.h + 80);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + o.w / 2, base - o.h - 80);
      ctx.quadraticCurveTo(x + o.w / 2 + 120, base - 60, x + o.w / 2 + 240, base - o.h - 80); ctx.stroke();
      break;
    case 'post':
      ctx.fillRect(x, base - 50, 6, 50);
      break;
    case 'pillar':
      ctx.fillRect(x, base - o.h - 40, 30, o.h + 40);
      ctx.fillRect(x - 6, base - o.h - 46, 42, 8);
      break;
  }
}

function drawGround() {
  ctx.fillStyle = '#101010';
  ctx.fillRect(0, GROUND, VW, VH - GROUND);
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(0, GROUND, VW, 2);
  ctx.fillStyle = '#1e1e1e';
  const start = Math.floor(camX / 90) * 90;
  for (let wx = start; wx < camX + VW + 90; wx += 90) ctx.fillRect(wx - camX, GROUND + 14 + ((wx / 90) % 3) * 9, 26, 2);
  // Street lamps with soft cones of light
  const ls = Math.floor(camX / 640) * 640 + 320;
  for (let wx = ls; wx < camX + VW + 640; wx += 640) {
    const x = wx - camX;
    ctx.fillStyle = '#141414';
    ctx.fillRect(x - 2, GROUND - 190, 4, 190);
    ctx.fillRect(x - 2, GROUND - 190, 24, 4);
    const g = ctx.createLinearGradient(0, GROUND - 185, 0, GROUND);
    g.addColorStop(0, 'rgba(242,242,242,0.12)'); g.addColorStop(1, 'rgba(242,242,242,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x + 14, GROUND - 185); ctx.lineTo(x + 84, GROUND); ctx.lineTo(x - 56, GROUND); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(x + 10, GROUND - 187, 10, 4);
  }
}

function drawProps() {
  for (const pr of props) {
    if (pr.kind === 'henchman') {
      const pose = pr.dead ? { ...P.limp(), rot: -Math.PI / 2 } : { ...P.kneel(), head: 0.5, lean: 0.35, armF: [0.4, 0.6], armB: [0.9, 1.2] };
      drawFigure(pr.x, GROUND, pr.face, pose, LOOKS.grunt);
    } else if (pr.kind === 'oracle') {
      ctx.fillStyle = '#0d0d0d'; ctx.fillRect(pr.x - 26, GROUND - 34, 52, 34);
      ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 1.5; ctx.strokeRect(pr.x - 26, GROUND - 34, 52, 34);
      drawFigure(pr.x, GROUND - 34, pr.face, P.sit(game.t), LOOKS.oracle);
    } else if (pr.kind === 'ghost') {
      const postX = pr.x - pr.face * 60;
      ctx.fillStyle = '#121212'; ctx.fillRect(postX - 8, GROUND - 200, 16, 200);
      const pose = { ...P.kneel(), head: 0.35, lean: 0.25, armF: [-0.9, 0.6], armB: [-1.1, 0.5] };
      const sk = drawFigure(pr.x, GROUND, pr.face, pose, LOOKS.ghost);
      const s = LOOKS.ghost.scale;
      ctx.strokeStyle = '#9a9a9a'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
      for (const arm of [sk.armF, sk.armB]) {
        ctx.beginPath(); ctx.moveTo(pr.x + arm.ex * s, GROUND + arm.ey * s); ctx.lineTo(postX, GROUND - 120); ctx.stroke();
      }

}

// ---- Rain, grain and vignette for the noir look ----
const rain = Array.from({ length: 140 }, () => ({ x: rand(0, VW + 200), y: rand(-VH, VH), len: rand(10, 22), spd: rand(650, 950) }));
function updateRain(dt) {
  for (const d of rain) {
    d.y += d.spd * dt; d.x -= d.spd * 0.22 * dt;
    if (d.y > VH) { d.y = rand(-60, -10); d.x = rand(0, VW + 200); }
  }
}
function drawRain(boost = 1) {
  ctx.strokeStyle = `rgba(242,242,242,${0.13 * boost})`; ctx.lineWidth = 1;
  ctx.beginPath();
  for (const d of rain) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.len * 0.22, d.y + d.len); }
  ctx.stroke();
}

const grain = Array.from({ length: 3 }, () => {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d'), img = g.createImageData(180, 180);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  return c;
});
function drawGrain() {
  ctx.save();
  ctx.globalAlpha = 0.055;
  ctx.fillStyle = ctx.createPattern(grain[Math.floor(game.t * 24) % 3], 'repeat');
  ctx.translate(-rand(0, 180), -rand(0, 180));
  ctx.fillRect(0, 0, VW + 180, VH + 180);
  ctx.restore();
}
function drawVignette() {
  const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VH * 0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}

// ---- Text helpers ----
function wrapText(text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawBubble(x, y, text) {
  ctx.font = '14px "Special Elite", monospace';
  const lines = wrapText(text, 200);
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 20, h = lines.length * 18 + 12;
  const bx = clamp(x - w / 2, camX + 8, camX + VW - w - 8), by = y - h;
  ctx.fillStyle = WHITE;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, w, h, 6) : ctx.rect(bx, by, w, h); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 6, by + h); ctx.lineTo(x + 6, by + h); ctx.lineTo(x, by + h + 9); ctx.fill();
  ctx.fillStyle = INK; ctx.textAlign = 'left';
  lines.forEach((l, i) => ctx.fillText(l, bx + 10, by + 20 + i * 18));
}

// Letters with optional inverted highlight boxes (for the m and o of IMmortal)
function drawLetters(letters, cx, baseline, size, alpha = 1, gap = 6) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `900 ${size}px Cinzel, serif`;
  ctx.textAlign = 'left';
  const widths = letters.map(l => ctx.measureText(l.ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + gap * (letters.length - 1);
  let x = cx - total / 2;
  const boxes = [];
  letters.forEach((l, i) => {
    if (l.hl) {
      const pad = Math.max(2, gap / 2 - 3); // leave a sliver between neighbouring boxes
      ctx.fillStyle = WHITE;
      ctx.fillRect(x - pad, baseline - size * 0.8, widths[i] + pad * 2, size * 0.94);
      ctx.fillStyle = INK;
      boxes.push({ x: x + widths[i] / 2, ch: l.ch });
    } else ctx.fillStyle = WHITE;
    ctx.fillText(l.ch, x, baseline);
    x += widths[i] + gap;
  });
  ctx.restore();
  return boxes;
}
const TITLE = [...'IMmortal'].map((ch, i) => ({ ch, hl: i === 2 || i === 3 }));
const MORTAL = [...'I’M MORTAL'].map((ch, i) => ({ ch, hl: i === 4 || i === 5 }));

// =====================================================================
//  Drawing: scenes
// =====================================================================
function drawWorld() {
  ctx.save();
  ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  drawSky(); drawFar(); drawMid(); drawGround();

  ctx.save();
  ctx.translate(-camX, 0);

  for (const s of splats) {
    ctx.fillStyle = '#262626';
    for (const b of s.blobs) { ctx.beginPath(); ctx.ellipse(s.x + b.dx, GROUND + 4, b.rx, b.ry, 0, 0, Math.PI * 2); ctx.fill(); }
  }

  if (game.arena && game.state === 'play') {
    ctx.strokeStyle = 'rgba(242,242,242,0.15)'; ctx.lineWidth = 2; ctx.setLineDash([6, 10]);
    for (const x of [game.arena.left + 6, game.arena.left + VW - 6]) { ctx.beginPath(); ctx.moveTo(x, GROUND - 220); ctx.lineTo(x, GROUND); ctx.stroke(); }
    ctx.setLineDash([]);
  }

  drawProps();

  // Mantis waits at the end of the road. When she reveals herself she grows taller.
  const mx = mantis.x - mantis.lunge * 70;
  const revealed = mantis.state === 'pray' || mantis.state === 'strike';
  const grow = revealed ? (mantis.state === 'strike' ? 1 : ease(Math.min(1, mantis.t / 0.9))) : 0;
  const mLook = { ...LOOKS.mantis, scale: lerp(LOOKS.mantis.scale, 1.35, grow) };
  drawFigure(mx, GROUND, -1, mantisPose(), mLook, { claws: revealed, glow: revealed });
  if (mantis.state === 'bound') {
    ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(mx - 4, GROUND - 52, 14, 4, 0, 0, Math.PI * 2); ctx.ellipse(mx - 4, GROUND - 38, 14, 4, 0, 0, Math.PI * 2); ctx.stroke();
  }

  for (const e of enemies) {
    if (!e.dead) continue;
    drawFigure(e.x, e.y, e.face, enemyPose(e), LOOKS[e.T.look], { alpha: 1 - clamp((e.deadT - 1.5) / 1, 0, 1) });
  }
  for (const e of enemies) {
    if (e.dead) continue;
    drawFigure(e.x, e.y, e.face, enemyPose(e), LOOKS[e.T.look], { flash: e.flash > 0, glow: e.state === 'windup' });
    if (e.state === 'windup') {
      ctx.fillStyle = WHITE; ctx.font = '900 24px Cinzel, serif'; ctx.textAlign = 'center';
      ctx.fillText('!', e.x, e.y - e.T.h - 18);
    }
  }

  const p = player;
  const blink = p.inv > 0 && p.state !== 'dodge' && p.state !== 'hurt' && Math.floor(game.t * 14) % 2 === 0;
  drawFigure(p.x, p.y, p.face, playerPose(p), LOOKS.oranus, { vx: p.vx, alpha: blink ? 0.4 : 1 });

  // Slash arcs while an attack is active
  if (p.state === 'light' || p.state === 'heavy') {
    const a = p.state === 'heavy' ? ATK.heavy : ATK.light[p.combo];
    if (p.t >= a.active[0] - 0.02 && p.t <= a.active[1] + 0.05) {
      ctx.strokeStyle = WHITE; ctx.lineWidth = p.state === 'heavy' ? 5 : 3;
      ctx.globalAlpha = 0.85;
      const cx = p.x + p.face * 22, cy = p.y - 84, r = a.reach * 0.8;
      const s0 = p.state === 'heavy' ? -1.4 : -0.7, s1 = p.state === 'heavy' ? 1.0 : 0.5;
      ctx.beginPath();
      if (p.face > 0) ctx.arc(cx, cy, r, s0, s1); else ctx.arc(cx, cy, r, Math.PI - s1, Math.PI - s0);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  for (const k of projectiles) {
    if (k.type === 'wave') {
      ctx.strokeStyle = WHITE; ctx.globalAlpha = clamp(k.life / 0.6, 0, 1);
      for (let i = 0; i < 3; i++) {
        ctx.lineWidth = 3 - i;
        ctx.beginPath(); ctx.ellipse(k.x - k.dir * i * 10, GROUND, 16 + i * 8, 7 + i * 6, 0, Math.PI, 0); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(k.rot);
    ctx.strokeStyle = WHITE; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
    ctx.restore();
  }

  ctx.strokeStyle = WHITE;
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.max);
    ctx.lineWidth = 2;
    const sp = Math.hypot(pt.vx, pt.vy) || 1;
    ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(pt.x - pt.vx / sp * pt.len, pt.y - pt.vy / sp * pt.len); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const r of rings) {
    ctx.globalAlpha = 1 - r.t / 0.7; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 20 + r.t * 420, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = 1 - t.t / 0.9;
    ctx.font = t.big ? '700 22px Cinzel, serif' : '16px "Special Elite", monospace';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(t.text, t.x, t.y - t.t * 40);
    ctx.fillStyle = t.big ? WHITE : '#e0e0e0';
    ctx.fillText(t.text, t.x, t.y - t.t * 40);
  }
  ctx.globalAlpha = 1;

  if (game.state === 'play' || game.state === 'dead') {
    for (const e of enemies) if (e.say && !e.dead) drawBubble(e.x, e.y - e.T.h - 30, e.say.text);
    if (mantis.say) drawBubble(mantis.x, GROUND - 150, mantis.say.text);
  }

  ctx.restore();
  drawRain();
  if (game.flash > 0) {
    ctx.fillStyle = `rgba(242,242,242,${game.flash * 0.35})`;
    ctx.fillRect(0, 0, VW, VH);
  }
  ctx.restore();
}

function drawHUD() {
  const p = player;
  const x = 24, y = 22;
  ctx.textAlign = 'left';
  ctx.fillStyle = WHITE; ctx.font = '700 16px Cinzel, serif';
  ctx.fillText('ORANUS', x, y + 12);
  ctx.font = '14px "Special Elite", monospace'; ctx.fillStyle = '#9a9a9a';
  ctx.fillText(`life ${toRoman(game.deaths + 1)}`, x + 92, y + 12);

  // HP bar is always drawn at the original 100 HP width, so lost capacity stays visible
  const bw = 240, bh = 12, by = y + 22;
  const maxW = bw * p.maxHp / BASE_HP, hpW = bw * Math.max(0, p.hp) / BASE_HP;
  ctx.save();
  ctx.beginPath(); ctx.rect(x + maxW, by, bw - maxW, bh); ctx.clip();
  ctx.strokeStyle = '#4a4a4a'; ctx.lineWidth = 1;
  for (let i = -bh; i < bw; i += 6) { ctx.beginPath(); ctx.moveTo(x + i, by + bh); ctx.lineTo(x + i + bh, by); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = '#333'; ctx.fillRect(x, by, maxW, bh);
  ctx.fillStyle = WHITE; ctx.fillRect(x, by, hpW, bh);
  ctx.strokeStyle = WHITE; ctx.lineWidth = 1.5; ctx.strokeRect(x, by, bw, bh);
  ctx.fillStyle = '#bdbdbd'; ctx.font = '14px "Special Elite", monospace';
  ctx.fillText(`HP ${Math.ceil(Math.max(0, p.hp))}/${Math.ceil(p.maxHp)}`, x, by + 30);
  ctx.fillText(`DMG ${p.dmg.toFixed(1)}`, x + 130, by + 30);

  // Progress: the O travels toward the M
  const tx = VW - 270, tw = 230, ty = 38;
  ctx.strokeStyle = '#5a5a5a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + tw, ty); ctx.stroke();
  const prog = clamp(p.x / (MANTIS_X - 125), 0, 1);
  ctx.strokeStyle = WHITE;
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + tw * prog, ty); ctx.stroke();
  for (const [lx, ch] of [[tx + tw, 'M'], [tx + tw * prog, 'O']]) {
    ctx.fillStyle = WHITE; ctx.fillRect(lx - 10, ty - 11, 20, 22);
    ctx.fillStyle = INK; ctx.font = '900 15px Cinzel, serif'; ctx.textAlign = 'center';
    ctx.fillText(ch, lx, ty + 6);
  }
  ctx.textAlign = 'left';

  if (bossRef && !bossRef.dead) {
    const w = 420, bx = (VW - w) / 2, byy = VH - 42;
    ctx.fillStyle = WHITE; ctx.font = '700 14px Cinzel, serif'; ctx.textAlign = 'center';
    ctx.fillText(bossRef.phase2 ? 'THE WARDEN — ENRAGED' : 'THE WARDEN', VW / 2, byy - 8);
    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(bx, byy, w, 8);
    ctx.fillStyle = WHITE; ctx.fillRect(bx, byy, w * Math.max(0, bossRef.hp) / bossRef.T.hp, 8);
    ctx.strokeStyle = WHITE; ctx.lineWidth = 1; ctx.strokeRect(bx, byy, w, 8);
  }

  if (game.goArrow > 0 && !game.arena && Math.floor(game.t * 3) % 2 === 0) {
    ctx.fillStyle = WHITE; ctx.font = '900 26px Cinzel, serif'; ctx.textAlign = 'right';
    ctx.fillText('GO →', VW - 40, VH / 2 - 20);
  }

  if (game.banner) {
    const b = game.banner, a = Math.min(1, b.t / 0.5) * (1 - clamp((b.t - 2.6) / 0.6, 0, 1));
    ctx.globalAlpha = a; ctx.textAlign = 'center';
    ctx.fillStyle = WHITE; ctx.font = '900 34px Cinzel, serif';
    ctx.fillText(b.title, VW / 2, 150);
    const w = ctx.measureText(b.title).width;
    ctx.fillRect(VW / 2 - w / 2 - 70, 138, 50, 1); ctx.fillRect(VW / 2 + w / 2 + 20, 138, 50, 1);
    if (b.sub) { ctx.font = '16px "Special Elite", monospace'; ctx.fillStyle = '#cfcfcf'; ctx.fillText(b.sub, VW / 2, 178); }
    ctx.globalAlpha = 1;
  }

  if (muted) { ctx.fillStyle = '#777'; ctx.font = '12px "Special Elite", monospace'; ctx.textAlign = 'right'; ctx.fillText('sound off (M)', VW - 24, VH - 14); }
  ctx.textAlign = 'left';
}

function drawDeathScreen() {
  const d = game.dead, t = d.t;
  ctx.fillStyle = `rgba(0,0,0,${Math.min(0.85, t * 1.6)})`;
  ctx.fillRect(0, 0, VW, VH);
  if (t < 0.3) return;
  ctx.globalAlpha = Math.min(1, (t - 0.3) * 2);
  ctx.textAlign = 'center';
  ctx.fillStyle = WHITE; ctx.font = '900 62px Cinzel, serif';
  ctx.fillText(`DEATH ${toRoman(d.n)}`, VW / 2, 165);
  ctx.font = '19px "Special Elite", monospace'; ctx.fillStyle = '#9a9a9a';
  ctx.fillText(d.line, VW / 2, 205);

  const k = ease(clamp((t - 0.9) / 1.0, 0, 1));
  const hp = lerp(d.from.hp, d.to.hp, k), dmg = lerp(d.from.dmg, d.to.dmg, k);
  ctx.font = '700 18px Cinzel, serif'; ctx.fillStyle = WHITE;
  ctx.textAlign = 'right'; ctx.fillText('MAX HP', VW / 2 - 20, 275); ctx.fillText('DAMAGE', VW / 2 - 20, 345);
  ctx.textAlign = 'left'; ctx.font = '20px "Special Elite", monospace';
  ctx.fillText(`${Math.ceil(d.from.hp)}  →  ${Math.ceil(hp)}`, VW / 2 + 10, 275);
  ctx.fillText(`${d.from.dmg.toFixed(1)}  →  ${dmg.toFixed(1)}`, VW / 2 + 10, 345);
  // Capacity bars shrink as you watch
  const bx = VW / 2 - 170, bw = 340;
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, 288, bw, 8); ctx.strokeRect(bx, 358, bw, 8);
  ctx.fillStyle = WHITE;
  ctx.fillRect(bx, 288, bw * hp / BASE_HP, 8);
  ctx.fillRect(bx, 358, bw * dmg / BASE_DMG, 8);

  if (t > 1.6 && Math.floor(t * 2) % 2 === 0) {
    ctx.textAlign = 'center'; ctx.font = '700 18px Cinzel, serif'; ctx.fillStyle = WHITE;
    ctx.fillText(document.body.classList.contains('touch') ? 'TAP TO RISE' : 'CLICK TO RISE', VW / 2, 440);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center'; ctx.fillStyle = WHITE;
  ctx.font = '900 46px Cinzel, serif'; ctx.fillText('PAUSED', VW / 2, 190);
  ctx.font = '17px "Special Elite", monospace'; ctx.fillStyle = '#b0b0b0';
  CONTROLS.forEach((l, i) => ctx.fillText(l, VW / 2, 240 + i * 28));
  ctx.textAlign = 'left';
}

function drawTitleScreen() {
  const saved = camX;
  camX = 200 + Math.sin(game.t * 0.08) * 160;
  drawSky(); drawFar(); drawMid(); drawGround();
  drawFigure(250, GROUND, 1, P.idle(game.t), LOOKS.oranus, { vx: 0 });
  drawRain();
  camX = saved;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, VW, VH);

  const boxes = drawLetters(TITLE, VW / 2, 210, 100, 1, 16);
  ctx.textAlign = 'center'; ctx.font = '15px "Special Elite", monospace'; ctx.fillStyle = '#a8a8a8';
  boxes.forEach(b => ctx.fillText(b.ch === 'm' ? 'mantis' : 'oranus', b.x, 248));
  ctx.font = '19px "Special Elite", monospace'; ctx.fillStyle = '#cfcfcf';
  ctx.fillText('a love story with diminishing returns', VW / 2, 300);
  if (Math.floor(game.t * 1.6) % 2 === 0) {
    ctx.font = '700 20px Cinzel, serif'; ctx.fillStyle = WHITE;
    ctx.fillText(document.body.classList.contains('touch') ? 'TAP TO BEGIN' : 'CLICK TO BEGIN', VW / 2, 380);
  }
  ctx.font = '14px "Special Elite", monospace'; ctx.fillStyle = '#8a8a8a';
  ctx.fillText('No checkpoints. Every death makes you weaker.', VW / 2, 488);
  ctx.textAlign = 'left';
}

function drawIntro() {
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, VW, VH);
  drawRain();
  const s = game.intro;
  ctx.textAlign = 'center';
  if (s.i < INTRO.length) {
    ctx.font = '26px "Special Elite", monospace'; ctx.fillStyle = WHITE;
    wrapText(INTRO[s.i].slice(0, Math.floor(s.chars)), 720).forEach((l, i) => ctx.fillText(l, VW / 2, 260 + i * 36));
  } else {
    ctx.font = '900 30px Cinzel, serif'; ctx.fillStyle = WHITE;
    ctx.fillText('HOW TO FIGHT', VW / 2, 120);
    ctx.font = '19px "Special Elite", monospace'; ctx.fillStyle = '#c8c8c8';
    const lines = document.body.classList.contains('touch')
      ? ['◀ ▶  move', '▲  jump', 'HIT  strike (tap for a combo)', 'HVY  heavy strike, breaks shields', 'ROLL  dodge through attacks']
      : CONTROLS;
    lines.forEach((l, i) => ctx.fillText(l, VW / 2, 170 + i * 32));
    ctx.fillStyle = '#8a8a8a'; ctx.font = '16px "Special Elite", monospace';
    ctx.fillText('An enemy that glows is about to strike. Roll at the last moment for a perfect dodge.', VW / 2, 390);
    ctx.fillText('They will surround you. Keep moving.', VW / 2, 414);
    if (Math.floor(game.t * 1.6) % 2 === 0) {
      ctx.font = '700 18px Cinzel, serif'; ctx.fillStyle = WHITE;
      ctx.fillText(document.body.classList.contains('touch') ? 'TAP TO BEGIN' : 'CLICK TO BEGIN', VW / 2, 470);
    }
  }
  if (s.i < INTRO.length) drawSkipHint(VH - 24);
  ctx.textAlign = 'left';
}

function drawFinal() {
  const t = game.final.t;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  drawRain();
  ctx.textAlign = 'center';

  if (t > 0.5 && t < 2.6) {
    const a = Math.min(1, (t - 0.5) * 3) * (1 - clamp((t - 2.2) / 0.4, 0, 1));
    ctx.globalAlpha = a;
    ctx.font = '900 44px Cinzel, serif';
    // Glitchy slices
    for (let i = 0; i < 6; i++) {
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 240 + i * 8, VW, 8); ctx.clip();
      const off = Math.random() < 0.25 ? rand(-14, 14) : 0;
      ctx.fillStyle = WHITE;
      ctx.fillText('RESPAWN FAILED', VW / 2 + off, 285);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  if (t > 2.8) {
    const a1 = clamp((t - 2.8) / 0.8, 0, 1) * (1 - clamp((t - 4.8) / 0.8, 0, 1));
    const a2 = clamp((t - 4.8) / 0.8, 0, 1);
    if (a1 > 0) drawLetters(TITLE, VW / 2, 200, 92, a1, 16);
    if (a2 > 0) drawLetters(MORTAL, VW / 2, 200, 92, a2, 16);
  }
  ctx.textAlign = 'center';
  const lines = [[6.4, 'Oranus. Mantis.'], [7.3, 'Together, the praying mantis.'], [8.2, 'Where the female kills the male.']];
  ctx.font = '21px "Special Elite", monospace';
  lines.forEach(([at, text], i) => {
    ctx.globalAlpha = clamp((t - at) / 0.7, 0, 1);
    ctx.fillStyle = i === 2 ? WHITE : '#b8b8b8';
    ctx.fillText(text, VW / 2, 290 + i * 34);
  });
  ctx.globalAlpha = clamp((t - 9.4) / 0.7, 0, 1);
  ctx.font = '15px "Special Elite", monospace'; ctx.fillStyle = '#8a8a8a';
  ctx.fillText(`deaths ${game.deaths}   ·   enemies defeated ${game.kills}   ·   final max HP ${Math.ceil(player.maxHp)}   ·   damage ${player.dmg.toFixed(1)}   ·   ${fmtTime(game.time)}`, VW / 2, 430);
  ctx.globalAlpha = 1;
  if (t > 10.4 && Math.floor(t * 1.6) % 2 === 0) {
    ctx.font = '700 18px Cinzel, serif'; ctx.fillStyle = WHITE;
    ctx.fillText(document.body.classList.contains('touch') ? 'TAP TO PLAY AGAIN' : 'CLICK TO PLAY AGAIN', VW / 2, 488);
  }
  if (t < 9.4) drawSkipHint();
  ctx.textAlign = 'left';
}

function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  switch (game.state) {
    case 'title': drawTitleScreen(); break;
    case 'intro': drawIntro(); break;
    case 'final': drawFinal(); break;
    case 'cine': drawCine(); break;
    default:
      drawWorld();
      drawHUD();
      if (game.state === 'dead') drawDeathScreen();
      if (game.state === 'paused') drawPause();
  }
  drawGrain();
  drawVignette();
  if (game.invert > 0) {
    ctx.globalCompositeOperation = 'difference';
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, VW, VH);
    ctx.globalCompositeOperation = 'source-over';
  }
}

// =====================================================================
let last = performance.now();
function frame(now) {
  // The first frame's timestamp can be earlier than `last`, so never let dt go negative
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// Pause when the tab is hidden
document.addEventListener('visibilitychange', () => { if (document.hidden && game.state === 'play') game.state = 'paused'; });
</script>
</body>
</html>
