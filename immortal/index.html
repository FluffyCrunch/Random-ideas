<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMmortal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas {
    display: block; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%); touch-action: none;
  }
  /* On-screen buttons, only shown on touch devices */
  #touch {
    position: fixed; left: 0; right: 0; bottom: 0; display: none;
    justify-content: space-between; align-items: flex-end;
    padding: 0 16px max(16px, env(safe-area-inset-bottom)); pointer-events: none;
  }
  body.touch #touch, body.touch #tpause { display: flex; }
  .pad { display: flex; gap: 10px; pointer-events: auto; }
  .pad.right { flex-wrap: wrap; justify-content: flex-end; max-width: 220px; }
  .tbtn {
    width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(242,242,242,.55);
    background: rgba(242,242,242,.06); color: #f2f2f2; font: 700 14px 'Cinzel', serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .tbtn.on { background: rgba(242,242,242,.35); }
  #tpause {
    position: fixed; top: 12px; right: 12px; display: none; width: 44px; height: 44px;
    align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="touch">
  <div class="pad">
    <button class="tbtn" data-a="left">◀</button>
    <button class="tbtn" data-a="right">▶</button>
  </div>
  <div class="pad right">
    <button class="tbtn" data-a="dodge">ROLL</button>
    <button class="tbtn" data-a="jump">▲</button>
    <button class="tbtn" data-a="heavy">HVY</button>
    <button class="tbtn" data-a="light">HIT</button>
  </div>
</div>
<button class="tbtn" id="tpause" data-a="pause">II</button>

<script>
// =====================================================================
//  IMmortal: a love story with diminishing returns
// =====================================================================

const VW = 960, VH = 540;          // logical resolution, scaled to fit the window
const GROUND = 440;                // feet line
const GRAV = 2300;
const LEVEL_END = 7200;
const MANTIS_X = 7020;
const BASE_HP = 100, BASE_DMG = 10;
const DECAY = 0.85;                // each death keeps 85% of max HP and damage
const MIN_HP = 40, MIN_DMG = 5;    // weakness floors, so the game stays finishable
const MAX_ATTACKERS = 3;           // melee enemies allowed to swing at once

const WHITE = '#f2f2f2', PAPER = '#f2f2f2', INK = '#0a0a0a';
const BODY = '#0b0b0b', BACK = '#1f1f1f', RIM = '#a6a6a6';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 1, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(innerWidth / VW, innerHeight / VH);
  canvas.style.width = VW * scale + 'px';
  canvas.style.height = VH * scale + 'px';
  canvas.width = Math.round(VW * scale * dpr);
  canvas.height = Math.round(VH * scale * dpr);
}
addEventListener('resize', resize);
resize();
// Canvas text doesn't trigger web-font downloads, so ask for them up front
['900 40px Cinzel', '700 16px Cinzel', '16px "Special Elite"'].forEach(f => document.fonts.load(f).catch(() => {}));

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const ease = t => t * t * (3 - 2 * t);
function seeded(seed) { seed = Math.max(1, Math.floor(seed)) % 2147483647 || 1; return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function toRoman(n) {
  const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
  if (n >= 40) return String(n);
  let out = '';
  for (const [v, s] of map) while (n >= v) { out += s; n -= v; }
  return out;
}
function fmtTime(s) { const m = Math.floor(s / 60); return `${m}:${String(Math.floor(s % 60)).padStart(2, '0')}`; }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function capsule(x1, y1, r1, x2, y2, r2) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.arc(x1, y1, r1, a + Math.PI / 2, a - Math.PI / 2);
  ctx.arc(x2, y2, r2, a - Math.PI / 2, a + Math.PI / 2);
  ctx.closePath();
  ctx.fill();
}

// ---------- Input (buffered so presses during hit-stop aren't lost) ----------
const keys = {};
const pressed = {};
// Simple controls: move, jump, Ctrl to dodge. Attacks are on the mouse (see below).
// W is deliberately not a jump key: Ctrl+W would close the browser tab mid-fight.
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', Space: 'jump',
  ControlLeft: 'dodge', ControlRight: 'dodge',
  Enter: 'confirm', KeyP: 'pause', Escape: 'pause', KeyM: 'mute',
};
function press(a) { if (!keys[a]) pressed[a] = game.t; keys[a] = true; }
function release(a) { keys[a] = false; }
function consume(a) {
  if (pressed[a] != null && game.t - pressed[a] < 0.15) { pressed[a] = null; return true; }
  return false;
}
addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  if (!a) return;
  e.preventDefault();
  unlockAudio();
  if (!e.repeat) press(a);
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) release(a); });
// A key released while the window was unfocused never sends keyup, so drop everything held
addEventListener('blur', () => { for (const a in keys) keys[a] = false; });
// Mouse: left click attacks (and confirms menus), right click is the heavy attack.
// mousedown fires for every button, unlike pointerdown, so both buttons always register.
canvas.addEventListener('mousedown', e => {
  unlockAudio();
  if (e.button === 0) { press('light'); pressed.confirm = game.t; }
  else if (e.button === 2) press('heavy');
});
addEventListener('mouseup', e => {
  if (e.button === 0) release('light');
  else if (e.button === 2) release('heavy');
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch') return;
  unlockAudio();
  document.body.classList.add('touch');
  pressed.confirm = game.t;
});
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
document.querySelectorAll('.tbtn').forEach(btn => {
  const a = btn.dataset.a;
  const down = e => { e.preventDefault(); unlockAudio(); press(a); if (a !== 'pause') pressed.confirm = game.t; btn.classList.add('on'); };
  const up = () => { release(a); btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('pointercancel', up);
});

// ---------- Sound (all synthesised, no files) ----------
let actx = null, muted = false, noiseBuf = null, rainGain = null;
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new AudioContext(); } catch { return; }
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // Soft rain ambience
  const src = actx.createBufferSource(), f = actx.createBiquadFilter();
  rainGain = actx.createGain();
  src.buffer = noiseBuf; src.loop = true;
  f.type = 'lowpass'; f.frequency.value = 900;
  rainGain.gain.value = muted ? 0 : 0.035;
  src.connect(f).connect(rainGain).connect(actx.destination);
  src.start();
}
function tone(freq, dur, type = 'sine', vol = 0.1, slide = 1) {
  if (!actx || muted) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq, type = 'lowpass') {
  if (!actx || muted) return;
  const t = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(actx.destination);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const sfx = {
  swing: heavy => noise(heavy ? 0.18 : 0.09, heavy ? 0.12 : 0.07, heavy ? 900 : 2400, 'highpass'),
  hit: heavy => { noise(0.12, heavy ? 0.4 : 0.25, 500); tone(heavy ? 70 : 110, 0.15, 'sine', 0.25, 0.4); },
  hurt: () => { tone(160, 0.25, 'sawtooth', 0.1, 0.4); noise(0.1, 0.2, 400); },
  death: () => { tone(220, 1.8, 'sine', 0.2, 0.15); tone(110, 1.8, 'triangle', 0.14, 0.25); },
  rise: () => { tone(110, 1.0, 'sine', 0.18, 4); tone(165, 1.0, 'triangle', 0.07, 4); },
  jump: () => tone(300, 0.08, 'triangle', 0.05, 1.6),
  dodge: () => noise(0.2, 0.08, 1200, 'bandpass'),
  throw: () => noise(0.1, 0.07, 3000, 'highpass'),
  parry: () => { tone(1200, 0.15, 'square', 0.05, 0.9); tone(1800, 0.12, 'triangle', 0.05, 0.9); },
  block: () => { tone(1500, 0.08, 'square', 0.05, 0.7); noise(0.06, 0.12, 4000, 'highpass'); },
  slam: () => { tone(55, 0.35, 'sine', 0.3, 0.5); noise(0.25, 0.3, 400); },
  tick: () => tone(700 + Math.random() * 300, 0.02, 'square', 0.012),
  stab: () => { noise(0.5, 0.45, 700); tone(55, 1.4, 'sine', 0.3, 0.3); },
  start: () => tone(220, 0.8, 'sine', 0.12, 2),
  sting: () => { tone(1200, 0.9, 'sine', 0.07, 0.25); tone(600, 0.9, 'triangle', 0.05, 0.3); noise(0.4, 0.06, 3000, 'highpass'); },
  cut: () => noise(0.05, 0.04, 4000, 'highpass'),
  thud: () => { tone(70, 0.4, 'sine', 0.25, 0.5); noise(0.2, 0.2, 300); },
  rope: () => noise(0.35, 0.1, 1500, 'bandpass'),
  rumble: () => tone(45, 1.8, 'sine', 0.3, 0.8),
  chains: () => { for (let i = 0; i < 4; i++) setTimeout(() => { tone(1800 + Math.random() * 600, 0.06, 'square', 0.03, 0.8); noise(0.05, 0.06, 5000, 'highpass'); }, i * 90); },
};
function toggleMute() {
  muted = !muted;
  if (rainGain) rainGain.gain.value = muted ? 0 : 0.035;
}

// =====================================================================
//  World data
// =====================================================================
const ZONES = [
  { x: 0, name: 'I. THE OUTSKIRTS', sub: 'where the trail begins' },
  { x: 1800, name: 'II. THE MARKET', sub: 'everyone has a price' },
  { x: 3600, name: 'III. THE BRIDGE', sub: 'no way back' },
  { x: 5400, name: 'IV. THE TOWER', sub: 'she is waiting' },
];

// Each encounter locks the screen until every wave is beaten.
// Some end with a cutscene where someone tries to warn Oranus.
const ENCOUNTERS = [
  { x: 650,  waves: [['grunt', 'grunt', 'grunt']] },
  { x: 1350, waves: [['grunt', 'thrower', 'grunt'], ['grunt', 'grunt']], scene: 'henchman' },
  { x: 2150, waves: [['guard', 'grunt', 'thrower'], ['grunt', 'grunt', 'grunt']] },
  { x: 2850, waves: [['brute', 'grunt', 'grunt']] },
  { x: 3350, waves: [['guard', 'thrower', 'thrower'], ['brute', 'grunt']], scene: 'oracle' },
  { x: 3950, waves: [['brute', 'guard', 'grunt']] },
  { x: 4650, waves: [['brute', 'thrower', 'thrower'], ['guard', 'guard', 'grunt']] },
  { x: 5150, waves: [['brute', 'brute', 'thrower']], scene: 'ghost' },
  { x: 5850, waves: [['guard', 'guard', 'thrower', 'thrower'], ['brute', 'grunt', 'grunt', 'grunt']] },
  { x: 6600, waves: [['warden']] },
];

const TYPES = {
  grunt:   { hp: 60,  dmg: 11, speed: 160, range: 74,  windup: 0.36, recover: 0.42, cd: [0.6, 1.2], w: 40, h: 140, kbRes: 1,    look: 'grunt' },
  thrower: { hp: 40,  dmg: 10, speed: 170, range: 0,   windup: 0.38, recover: 0.4,  cd: [1.1, 1.9], w: 36, h: 136, kbRes: 1,    look: 'thrower', ranged: true },
  guard:   { hp: 95,  dmg: 14, speed: 130, range: 78,  windup: 0.44, recover: 0.5,  cd: [0.9, 1.5], w: 50, h: 146, kbRes: 0.6,  look: 'guard', shield: true },
  brute:   { hp: 190, dmg: 24, speed: 95,  range: 102, windup: 0.68, recover: 0.7,  cd: [1.3, 2.1], w: 64, h: 178, kbRes: 0.35, look: 'brute', armor: true },
  warden:  { hp: 600, dmg: 24, speed: 160, range: 122, windup: 0.6,  recover: 0.55, cd: [0.6, 1.1], w: 80, h: 210, kbRes: 0.2,  look: 'warden', armor: true, boss: true },
};

// Light combo: punch, punch, kick. Heavy: overhead smash that staggers anything.
const ATK = {
  light: [
    { dur: 0.26, active: [0.07, 0.15], reach: 92,  mult: 1.0, kb: 170 },
    { dur: 0.26, active: [0.07, 0.15], reach: 92,  mult: 1.1, kb: 170 },
    { dur: 0.4,  active: [0.12, 0.22], reach: 108, mult: 1.7, kb: 420, stagger: true },
  ],
  heavy: { dur: 0.62, active: [0.32, 0.42], reach: 118, mult: 2.4, kb: 540, stagger: true },
};

const TAUNTS = {
  any: [
    'Turn back, Oranus.', "She's not who you think.", 'Who do you think pays us?',
    'Go home, lover boy.', "She said you'd come.", 'Nothing personal. Strictly business.',
    "You really don't get it, do you?", 'Surround him!',
  ],
  after: [
    'Back again? You look smaller.', "Weren't you taller last time?", 'Every time you rise, you shrink.',
    "Keep dying. She'd like that.", "Immortal? You're barely breathing.", 'Same guy. Less of him.',
  ],
};

const DEATH_LINES = [
  'Immortality has side effects.', 'You get back up. Less of you does.',
  'Love hurts. Specifically, your max HP.', 'Respawning with 15% less everything.',
  "She's worth it. Probably.", "The body heals. The numbers don't.",
  'Death is temporary. Weakness is forever.', "Your enemies remember. Your muscles don't.",
];

const CONTROLS = [
  'A D  or  ← →     move',
  'Space  or  ↑     jump',
  'Left click     attack (click fast for a combo)',
  'Right click     heavy attack, breaks shields',
  'Ctrl     dodge roll',
  'P     pause   ·   M     sound',
];

const INTRO = [
  'Oranus cannot die.',
  'When he falls, he rises again.',
  'But every time he rises, a little less of him comes back.',
  'Tonight, they took Mantis.',
  'There are no checkpoints. Only the way forward.',
];

// =====================================================================
//  Game state
// =====================================================================
const game = {
  state: 'title', t: 0, deaths: 0, kills: 0, time: 0,
  hitstop: 0, shake: 0, flash: 0, invert: 0, slowmo: 0, dieT: 0,
  zoneIdx: -1, banner: null, goArrow: 0, arena: null, wave: 0, encounters: [],
  intro: null, dead: null, final: null, lastKilled: null,
};
const cine = { name: null, shots: [], i: 0, t: 0, chars: 0, text: '', lines: [], cam: 0 };
let player, enemies, projectiles, particles, rings, texts, splats, props, camX = 0, mantis, bossRef;

function makePlayer() {
  return {
    x: 120, y: GROUND, vx: 0, vy: 0, face: 1, onGround: true,
    maxHp: BASE_HP, hp: BASE_HP, dmg: BASE_DMG,
    state: 'idle', t: 0, combo: 0, comboQueued: false, hitSet: new Set(), inv: 0, dodgeCd: 0, perfect: false,
  };
}
function makeEnemy(type, x) {
  const T = TYPES[type];
  return {
    type, T, x, y: GROUND, vx: 0, vy: 0, kbv: 0, face: -1, side: 1, hp: T.hp,
    state: 'approach', t: 0, cd: rand(0.3, 0.9), flash: 0, dead: false, deadT: 0,
    kind: null, wind: 0, hitsLeft: 1, hitDone: false, stagger: 0, entering: true, say: null,
    phase2: false, seed: Math.random() * 10,
  };
}
function resetGame() {
  player = makePlayer();
  enemies = []; projectiles = []; particles = []; rings = []; texts = []; splats = []; props = [];
  camX = 0; bossRef = null;
  mantis = { state: 'bound', t: 0, x: MANTIS_X, say: null, lunge: 0 };
  Object.assign(game, {
    deaths: 0, kills: 0, time: 0, hitstop: 0, slowmo: 0, dieT: 0, zoneIdx: -1, banner: null,
    goArrow: 0, arena: null, wave: 0, final: null, lastKilled: null,
    encounters: ENCOUNTERS.map(e => ({ ...e, done: false })),
  });
}
resetGame();

// =====================================================================
//  Effects
// =====================================================================
function burst(x, y, n, speed = 420) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(80, speed);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: rand(0.25, 0.55), max: 0.55, len: rand(4, 10) });
  }
}
function ring(x, y) { rings.push({ x, y, t: 0 }); }
function popText(x, y, text, big = false) { texts.push({ x, y, text, t: 0, big }); }
function say(who, text, dur = 2.6) { if (who) who.say = { text, t: dur }; }
function showBanner(title, sub) { game.banner = { title, sub, t: 0 }; }
function makeSplat(x) {
  return { x, blobs: Array.from({ length: 6 }, () => ({ dx: rand(-34, 34), rx: rand(8, 28), ry: rand(2, 5) })) };
}

function updateEffects(dt) {
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.vx *= Math.exp(-3 * dt); }
  particles = particles.filter(p => p.life > 0);
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < 0.7);
  for (const t of texts) t.t += dt;
  texts = texts.filter(t => t.t < 0.9);
  if (game.banner && (game.banner.t += dt) > 3.2) game.banner = null;
  game.goArrow = Math.max(0, game.goArrow - dt);
  for (const e of [...enemies, mantis]) if (e.say && (e.say.t -= dt) <= 0) e.say = null;
}

// =====================================================================
//  Player
// =====================================================================
// Shared by Oranus and the enemies, so nobody can stand somewhere the other can't reach
function arenaBounds() {
  const a = game.arena;
  return [a.left + 20, Math.min(a.left + VW - 20, MANTIS_X - 80)];
}
function playerBounds() {
  if (game.arena) return arenaBounds();
  return [20, MANTIS_X - 80];
}

function physics(o, dt, minX, maxX) {
  o.vy += GRAV * dt;
  o.y += o.vy * dt;
  if (o.y >= GROUND) { o.y = GROUND; o.vy = 0; o.onGround = true; } else o.onGround = false;
  o.x = clamp(o.x + o.vx * dt, minX, maxX);
}

function startAttack(kind, chained = false) {
  const p = player;
  p.state = kind; p.t = 0; p.hitSet = new Set(); p.comboQueued = false;
  if (!chained) p.combo = 0;
  if (keys.left) p.face = -1;
  if (keys.right) p.face = 1;
  p.vx = p.face * (kind === 'heavy' ? 60 : 160);
  sfx.swing(kind === 'heavy');
}

function updatePlayer(dt) {
  const p = player;
  const [minX, maxX] = playerBounds();
  p.inv = Math.max(0, p.inv - dt);
  p.dodgeCd -= dt;

  if (p.state === 'dying' || p.state === 'fallen') {
    p.t += dt;
    p.vx *= Math.exp(-6 * dt);
    physics(p, dt, minX, maxX);
    return;
  }

  const move = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);

  if (p.state === 'light' || p.state === 'heavy') {
    p.t += dt;
    const a = p.state === 'heavy' ? ATK.heavy : ATK.light[p.combo];
    if (p.t >= a.active[0] && p.t <= a.active[1]) playerHit(a);
    if (p.state === 'light' && p.combo < 2 && consume('light')) p.comboQueued = true;
    p.vx *= Math.exp(-10 * dt);
    if (p.t >= a.dur) {
      if (p.comboQueued) { p.combo++; startAttack('light', true); }
      else { p.state = 'idle'; p.combo = 0; }
    }
  } else if (p.state === 'dodge') {
    p.t += dt;
    p.vx = p.face * 560 * (1 - p.t / 0.36);
    if (p.t >= 0.36) p.state = 'idle';
  } else if (p.state === 'hurt') {
    p.t += dt;
    p.vx *= Math.exp(-8 * dt);
    if (p.t >= 0.32) p.state = 'idle';
  } else {
    p.vx = move * 290;
    if (move) p.face = move;
    if (consume('jump') && p.onGround) { p.vy = -900; p.onGround = false; sfx.jump(); }
    if (consume('light')) startAttack('light');
    else if (consume('heavy')) startAttack('heavy');
    else if (p.dodgeCd <= 0 && consume('dodge')) {
      p.state = 'dodge'; p.t = 0; p.inv = Math.max(p.inv, 0.3); p.dodgeCd = 0.75; p.perfect = false;
      if (move) p.face = move;
      sfx.dodge();
    }
  }
  physics(p, dt, minX, maxX);
}

function playerHit(a) {
  const p = player;
  const x0 = p.face > 0 ? p.x + 6 : p.x - 6 - a.reach, x1 = x0 + a.reach;
  const y0 = p.y - 140, y1 = p.y - 5;
  for (const e of enemies) {
    if (e.dead || p.hitSet.has(e)) continue;
    const ex0 = e.x - e.T.w / 2, ex1 = e.x + e.T.w / 2, ey0 = e.y - e.T.h;
    if (x1 < ex0 || x0 > ex1 || y1 < ey0 || y0 > e.y) continue;
    p.hitSet.add(e);
    damageEnemy(e, p.dmg * a.mult, a);
  }
  // Knives can be knocked out of the air
  for (const k of projectiles) {
    if (k.type === 'wave' || k.dead) continue;
    if (k.x > x0 - 10 && k.x < x1 + 10 && k.y > y0 && k.y < y1) {
      k.dead = true;
      popText(k.x, k.y - 20, 'PARRY');
      sfx.parry();
      burst(k.x, k.y, 8);
    }
  }
}

function damageEnemy(e, dmg, a) {
  const dir = Math.sign(e.x - player.x) || player.face;
  // Guards block light hits from the front; heavy hits and the combo kick break through
  if (e.T.shield && !a.stagger && e.state !== 'hurt' && e.state !== 'attack' && Math.sign(player.x - e.x) === e.face) {
    popText(e.x, e.y - e.T.h - 10, 'BLOCK');
    burst(e.x + e.face * 24, e.y - 90, 6, 240);
    sfx.block();
    player.vx = -player.face * 240;
    game.hitstop = 0.04;
    e.flash = 0.06;
    return;
  }
  e.hp -= dmg;
  e.flash = 0.12;
  game.hitstop = a.stagger ? 0.09 : 0.05;
  game.shake = Math.max(game.shake, a.stagger ? 9 : 4);
  e.kbv = dir * a.kb * e.T.kbRes;
  popText(e.x, e.y - e.T.h - 12, dmg < 10 ? dmg.toFixed(1) : String(Math.round(dmg)));
  burst(e.x - dir * 10, e.y - e.T.h * 0.6, a.stagger ? 14 : 8);
  sfx.hit(a.stagger);
  if (e.hp <= 0) { killEnemy(e, dir); return; }
  if (e.T.boss && !e.phase2 && e.hp < e.T.hp / 2) {
    e.phase2 = true;
    say(e, 'Enough games.', 2.5);
    game.shake = 12;
    summonAdds();
  }
  if (!e.T.armor || a.stagger) {
    if (e.T.shield && a.stagger) popText(e.x, e.y - e.T.h - 34, 'BREAK', true);
    e.state = 'hurt'; e.t = 0;
    e.stagger = e.T.boss ? 0.25 : e.T.shield && a.stagger ? 0.8 : a.stagger ? 0.45 : 0.26;
  }
}

function summonAdds() {
  const a = game.arena;
  if (!a) return;
  for (const d of [-1, 1]) {
    const g = makeEnemy('grunt', d < 0 ? a.left - 40 : a.left + VW + 40);
    g.side = d; g.face = -d;
    enemies.push(g);
  }
}

function killEnemy(e, dir) {
  e.dead = true; e.deadT = 0; e.say = null;
  e.kbv = dir * 380; e.vy = -320;
  game.kills++;
  game.lastKilled = e;
  splats.push(makeSplat(e.x + dir * 30));
  if (e === bossRef) {
    bossRef = null;
    game.slowmo = 1.2;
    game.shake = 16;
    showBanner('THE WARDEN FALLS', 'the tower is open');
  }
}

// Returns true when the hit actually landed
function hurtPlayer(dmg, dir, src) {
  const p = player;
  if (p.state === 'dying' || game.state !== 'play') return false;
  // Dodging right as an attack lands is a perfect dodge: slow-mo and the attacker is stunned
  if (p.state === 'dodge' && p.t < 0.22) {
    if (!p.perfect) {
      p.perfect = true;
      game.slowmo = Math.max(game.slowmo, 0.6);
      popText(p.x, p.y - 160, 'PERFECT', true);
      ring(p.x, p.y - 70);
      sfx.parry();
      if (src && !src.dead) { src.state = 'hurt'; src.t = 0; src.stagger = 0.8; }
    }
    return false;
  }
  if (p.inv > 0) return false;
  p.hp -= dmg;
  p.state = 'hurt'; p.t = 0; p.vx = dir * 320; p.inv = 0.45;
  game.shake = Math.max(game.shake, 8);
  game.flash = 0.25;
  sfx.hurt();
  popText(p.x, p.y - 158, '-' + Math.round(dmg), true);
  burst(p.x, p.y - 80, 10);
  if (p.hp <= 0) { p.hp = 0; die(); }
  return true;
}

function die() {
  player.state = 'dying'; player.t = 0;
  game.invert = 0.18;
  game.slowmo = 1.4;
  game.dieT = 0;
  projectiles = [];
  sfx.death();
}

function enterDeathScreen() {
  const p = player;
  game.state = 'dead';
  game.dead = {
    t: 0, n: game.deaths + 1, line: pick(DEATH_LINES),
    from: { hp: p.maxHp, dmg: p.dmg },
    to: { hp: Math.max(MIN_HP, p.maxHp * DECAY), dmg: Math.max(MIN_DMG, p.dmg * DECAY) },
  };
}

function rise() {
  const p = player, d = game.dead;
  game.deaths++;
  p.maxHp = d.to.hp; p.dmg = d.to.dmg; p.hp = p.maxHp;
  p.state = 'idle'; p.t = 0; p.inv = 2; p.vx = 0;
  game.state = 'play';
  sfx.rise();
  ring(p.x, p.y - 70);
  popText(p.x, p.y - 165, 'RISE', true);
  // Rising knocks nearby enemies away so you aren't instantly killed again
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - p.x;
    if (Math.abs(dx) < 340) { e.kbv = (Math.sign(dx) || 1) * 540; e.state = 'hurt'; e.t = 0; e.stagger = 0.9; }
  }
}

// =====================================================================
//  Enemies
// =====================================================================
function attackers() {
  return enemies.filter(e => !e.dead && !e.T.boss && !e.T.ranged && (e.state === 'windup' || e.state === 'attack')).length;
}

function startWindup(e, kind, wind) { e.state = 'windup'; e.t = 0; e.kind = kind; e.wind = wind; }

function throwKnife(e) {
  projectiles.push({ type: 'knife', x: e.x + e.face * 22, y: e.y - 96, vx: e.face * 520, dmg: e.T.dmg, life: 3, rot: 0 });
  sfx.throw();
}

function meleeStrike(e, dist) {
  const p = player, T = e.T;
  const inFront = Math.sign(p.x - e.x) === e.face || dist < 24;
  const mult = T.boss && e.kind === 'melee' ? 0.6 : 1;
  if (inFront && dist <= T.range + 22 && p.y > GROUND - 80) hurtPlayer(T.dmg * mult, e.face, e);
  if (e.kind === 'slam') {
    // Ground shockwaves roll out both ways: jump or roll over them
    game.shake = Math.max(game.shake, 9);
    for (const d of [-1, 1]) projectiles.push({ type: 'wave', x: e.x + d * 30, dir: d, life: 0.6, dmg: Math.round(T.dmg * 0.55), hit: false });
    burst(e.x + e.face * 40, GROUND - 4, 10, 300);
    sfx.slam();
  }
}

function updateEnemy(e, dt) {
  e.flash = Math.max(0, e.flash - dt);
  if (e.dead) {
    e.deadT += dt;
    e.vy += GRAV * dt;
    e.y = Math.min(GROUND, e.y + e.vy * dt);
    e.kbv *= Math.exp(-5 * dt);
    e.x += e.kbv * dt;
    return;
  }
  const p = player, T = e.T;
  const dx = p.x - e.x, dist = Math.abs(dx), dir = Math.sign(dx) || 1;
  const playerDown = p.state === 'dying' || game.state !== 'play';
  const haste = e.phase2 ? 0.8 : 1;
  e.cd -= dt;
  e.t += dt;
  let vx = 0;

  switch (e.state) {
    case 'approach': {
      e.face = dir;
      if (playerDown) break;
      if (e.entering) { vx = dir * T.speed; break; }
      if (T.ranged) {
        if (dist < 260) vx = -dir * T.speed;
        else if (dist > 420) vx = dir * T.speed;
        if (e.cd <= 0 && dist < 600) { e.hitsLeft = Math.random() < 0.35 ? 2 : 1; startWindup(e, 'throw', T.windup); }
        break;
      }
      // Each melee enemy holds a slot on one side of the player, so groups surround you
      let slot = p.x + e.side * T.range * 0.85;
      if (game.arena) {
        const [lo, hi] = arenaBounds();
        if (slot < lo + 10 || slot > hi - 10) slot = p.x - e.side * T.range * 0.85;
      }
      const toSlot = slot - e.x;
      if (Math.abs(toSlot) > 12) vx = Math.sign(toSlot) * T.speed * (e.phase2 ? 1.25 : 1);
      if (T.boss && e.cd <= 0 && dist > 240 && dist < 560) { startWindup(e, 'dash', 0.5 * haste); break; }
      if (dist <= T.range + 14 && e.cd <= 0 && (T.boss || attackers() < MAX_ATTACKERS)) {
        if (T.boss) {
          const slam = Math.random() < 0.4;
          e.hitsLeft = slam ? 1 : 3;
          startWindup(e, slam ? 'slam' : 'melee', (slam ? T.windup * 1.2 : 0.32) * haste);
        } else {
          e.hitsLeft = e.type === 'grunt' && Math.random() < 0.5 ? 2 : 1;
          startWindup(e, e.type === 'brute' ? 'slam' : 'melee', T.windup);
        }
      }
      break;
    }
    case 'windup':
      if (e.t >= e.wind) {
        e.state = 'attack'; e.t = 0; e.hitDone = false;
        if (e.kind === 'throw') throwKnife(e);
        else sfx.swing(T.boss || e.type === 'brute');
      }
      break;
    case 'attack':
      if (e.kind === 'dash') {
        vx = e.face * 680;
        if (!e.hitDone && Math.abs(p.x - e.x) < 56 && p.y > GROUND - 90 && hurtPlayer(T.dmg * 0.8, e.face, e)) e.hitDone = true;
        if (e.t >= 0.45) { e.state = 'recover'; e.t = 0; }
        break;
      }
      if (e.kind !== 'throw' && !e.hitDone) { e.hitDone = true; meleeStrike(e, dist); }
      if (e.t >= 0.18) {
        if (e.hitsLeft > 1) { e.hitsLeft--; startWindup(e, e.kind, (e.kind === 'throw' ? 0.24 : 0.2) * haste); }
        else { e.state = 'recover'; e.t = 0; }
      }
      break;
    case 'recover':
      if (e.t >= T.recover * haste) { e.state = 'approach'; e.t = 0; e.cd = rand(...T.cd) * haste; }
      break;
    case 'hurt':
      if (e.t >= e.stagger) { e.state = 'approach'; e.t = 0; e.cd = Math.max(e.cd, 0.25); }
      break;
  }

  e.kbv *= Math.exp(-7 * dt);
  e.vx = vx;
  e.x += (vx + e.kbv) * dt;
  if (game.arena) {
    // Once an enemy has walked on screen it joins the fight and stays inside the arena
    const a = game.arena, [lo, hi] = arenaBounds();
    if (e.entering && e.x > a.left + 30 && e.x < a.left + VW - 30) e.entering = false;
    if (!e.entering) e.x = clamp(e.x, lo, hi);
  }
}

// Stop enemies from stacking on top of each other
function separate() {
  const alive = enemies.filter(e => !e.dead);
  for (let i = 0; i < alive.length; i++) {
    for (let j = i + 1; j < alive.length; j++) {
      const a = alive[i], b = alive[j];
      const min = (a.T.w + b.T.w) * 0.45, d = b.x - a.x;
      if (Math.abs(d) < min) {
        const push = (min - Math.abs(d)) / 2 * (d < 0 ? -1 : 1);
        a.x -= push; b.x += push;
      }
    }
  }
}

function updateProjectiles(dt) {
  const p = player;
  for (const k of projectiles) {
    if (k.type === 'wave') {
      k.x += k.dir * 560 * dt; k.life -= dt;
      if (!k.hit && Math.abs(k.x - p.x) < 24 && p.y > GROUND - 28 && hurtPlayer(k.dmg, k.dir, null)) k.hit = true;
      continue;
    }
    k.x += k.vx * dt; k.life -= dt; k.rot += dt * 22;
    if (!k.dead && Math.abs(k.x - p.x) < 20 && k.y > p.y - 138 && k.y < p.y - 4 && hurtPlayer(k.dmg, Math.sign(k.vx), null)) k.dead = true;
  }
  projectiles = projectiles.filter(k => !k.dead && k.life > 0);
}

// =====================================================================
//  Encounters, zones, camera
// =====================================================================
function startEncounter(enc) {
  game.arena = { enc, left: clamp(enc.x - 380, 0, LEVEL_END - VW) };
  game.wave = 0;
  spawnWave(enc.waves[0]);
}

function spawnWave(list) {
  const a = game.arena;
  const isBoss = list.includes('warden');
  let side = isBoss ? 1 : Math.random() < 0.5 ? -1 : 1;
  list.forEach((type, i) => {
    const x = side < 0 ? a.left - 40 - i * 40 : a.left + VW + 40 + i * 40;
    const e = makeEnemy(type, x);
    e.face = -side;
    e.side = side;
    enemies.push(e);
    side *= -1;
  });
  if (isBoss) {
    bossRef = enemies.find(e => e.type === 'warden' && !e.dead);
    say(bossRef, "She said you'd come. She said to make it hurt.", 3.5);
    say(mantis, 'Oranus! Save me!', 3);
    showBanner('THE WARDEN', 'keeper of the tower');
  } else if (Math.random() < 0.75) {
    const talker = enemies[enemies.length - 1];
    const pool = game.deaths > 0 && Math.random() < 0.6 ? TAUNTS.after : TAUNTS.any;
    say(talker, pick(pool));
  }
}

function updateEncounters() {
  if (!game.arena) {
    const enc = game.encounters.find(e => !e.done);
    if (enc && player.x >= enc.x - 120) startEncounter(enc);
    return;
  }
  if (enemies.some(e => !e.dead)) return;
  const enc = game.arena.enc;
  if (game.wave < enc.waves.length - 1) {
    game.wave++;
    spawnWave(enc.waves[game.wave]);
  } else {
    enc.done = true;
    game.arena = null;
    if (enc.scene) playScene(enc.scene);
    else game.goArrow = 3;
  }
}

function updateZones() {
  for (let i = ZONES.length - 1; i >= 0; i--) {
    if (player.x >= ZONES[i].x) {
      if (i > game.zoneIdx) { game.zoneIdx = i; showBanner(ZONES[i].name, ZONES[i].sub); }
      break;
    }
  }
}

function updateCamera(dt) {
  let target;
  if (game.arena) target = game.arena.left;
  else target = clamp(player.x - VW * 0.38, 0, LEVEL_END - VW);
  camX = lerp(camX, target, 1 - Math.exp(-dt * 5));
}

// =====================================================================
//  Main update
// =====================================================================
function update(dt) {
  game.t += dt;
  updateRain(dt);
  if (consume('mute')) toggleMute();

  switch (game.state) {
    case 'title':
      if (consume('confirm')) {
        resetGame();
        game.state = 'intro';
        game.intro = { i: 0, t: 0, chars: 0, doneT: null };
        skipHold = 0;
        clearInput();
        sfx.start();
      }
      break;
    case 'intro': updateIntro(dt); break;
    case 'play':
      if (consume('pause')) { game.state = 'paused'; break; }
      updatePlay(dt);
      break;
    case 'paused':
      if (consume('pause') || consume('confirm')) game.state = 'play';
      break;
    case 'dead':
      game.dead.t += dt;
      enemies.forEach(e => updateEnemy(e, dt));
      updateEffects(dt);
      if (game.dead.t > 1.6 && consume('confirm')) { rise(); clearInput(); }
      break;
    case 'cine': updateCine(dt); break;
    case 'final': {
      const f = game.final;
      f.t += dt;
      if (f.t < 9.4 && holdToSkip(dt)) { f.t = 9.4; clearInput(); }
      if (f.t > 10.4 && consume('confirm')) { resetGame(); game.state = 'title'; clearInput(); }
      break;
    }
  }
  game.shake *= Math.exp(-dt * 10);
  game.flash = Math.max(0, game.flash - dt);
  game.invert = Math.max(0, game.invert - dt);
}

function updatePlay(dt) {
  game.time += dt;
  if (game.hitstop > 0) { game.hitstop -= dt; return; }
  let sdt = dt;
  if (game.slowmo > 0) { game.slowmo -= dt; sdt = dt * 0.35; }

  updatePlayer(sdt);
  enemies.forEach(e => updateEnemy(e, sdt));
  separate();
  enemies = enemies.filter(e => !e.dead || e.deadT < 2.6);
  updateProjectiles(sdt);
  updateEffects(sdt);
  updateEncounters();
  if (game.state !== 'play') return;
  updateZones();
  updateCamera(dt);

  if (player.state === 'dying' && (game.dieT += dt) > 1.5) enterDeathScreen();
  if (!game.arena && game.encounters.every(e => e.done) && player.x >= MANTIS_X - 230 && player.state !== 'dying') playScene('finale');
}

function updateIntro(dt) {
  const s = game.intro;
  s.t += dt;
  if (s.i < INTRO.length) {
    // The story cards play by themselves; holding Esc jumps to the controls card
    if (holdToSkip(dt)) { s.i = INTRO.length - 1; nextIntro(); return; }
    const full = INTRO[s.i];
    const before = Math.floor(s.chars);
    s.chars = Math.min(full.length, s.chars + dt * 30);
    if (Math.floor(s.chars) > before && before % 2 === 0) sfx.tick();
    if (s.chars >= full.length && s.doneT == null) s.doneT = s.t;
    if (s.doneT != null && s.t - s.doneT > 2.4) nextIntro();
  } else if (consume('confirm')) beginPlay();
}
function nextIntro() {
  Object.assign(game.intro, { i: game.intro.i + 1, t: 0, chars: 0, doneT: null });
  skipHold = 0;
  clearInput();
}
function beginPlay() { game.state = 'play'; clearInput(); sfx.start(); }

// =====================================================================
//  Cutscenes: anime / manga style shots
// =====================================================================
const NAME = { oranus: 'ORANUS', mantis: 'MANTIS', henchman: 'HENCHMAN', oracle: 'OLD WOMAN', ghost: 'STRANGER' };
const L = (who, text) => ({ who: NAME[who], text });
const WIDE = (o = {}) => ({ kind: 'wide', zoom: 0.012, ...o });
const FACE = (who, expr, o = {}) => ({ kind: 'face', who, expr, ...o });
const EYES = (who, expr, o = {}) => ({ kind: 'eyes', who, expr, zoom: 0.035, ...o });
const SPLIT = (left, right, o = {}) => ({ kind: 'split', left, right, ...o });
const IMPACT = (text, o = {}) => ({ kind: 'impact', text, dur: 0.9, zoom: 0, ...o });

function walkOn(dt) { player.face = 1; player.vx = 130; player.x = Math.min(player.x + 130 * dt, MANTIS_X - 80); }
function walkToMantis(dt) {
  const p = player, dx = MANTIS_X - 125 - p.x;
  p.vx = Math.abs(dx) > 4 ? Math.sign(dx) * 160 : 0;
  p.face = p.vx < 0 ? -1 : 1;
  p.x += p.vx * dt;
}

// Puts the person giving the warning into the world near Oranus
const SCENE_INIT = {
  henchman: () => {
    const e = game.lastKilled, x = e ? e.x : player.x + 110;
    enemies = enemies.filter(en => en !== e);
    const face = Math.sign(player.x - x) || -1;
    props.push({ kind: 'henchman', x, face, dead: false });
    player.face = -face;
    cine.cam = clamp((player.x + x) / 2 - VW / 2, 0, LEVEL_END - VW);
  },
  oracle: () => {
    const x = player.x + 230;
    props.push({ kind: 'oracle', x, face: -1 });
    player.face = 1;
    cine.cam = clamp((player.x + x) / 2 - VW / 2, 0, LEVEL_END - VW);
  },
  ghost: () => {
    const x = player.x + 220;
    props.push({ kind: 'ghost', x, face: -1 });
    player.face = 1;
    cine.cam = clamp((player.x + x) / 2 - VW / 2, 0, LEVEL_END - VW);

  finale: () => { cine.cam = MANTIS_X - VW * 0.62; },

function mantisStrike() {
  mantis.state = 'strike'; mantis.t = 0;
  player.state = 'fallen'; player.t = 0; player.hp = 0; player.vx = -120;
  game.invert = 0.22;
  game.shake = 16;
  burst(player.x, player.y - 80, 24, 520);
  sfx.stab();
}

function playScene(name) {
  game.state = 'cine';
  skipHold = 0;
  clearInput();
  cine.name = name;
  projectiles = [];
  enemies.forEach(e => (e.say = null));
  Object.assign(player, { state: 'idle', t: 0, vx: 0, vy: 0, y: GROUND, inv: 0 });
  SCENE_INIT[name]?.();
  cine.shots = SCENES[name]();
  cine.i = 0;
  startShot();
}

function startShot() {
  const s = cine.shots[cine.i];
  cine.t = 0; cine.chars = 0;
  cine.text = s.line ? s.line.text : '';
  ctx.font = '21px "Special Elite", monospace';
  cine.lines = cine.text ? wrapText(cine.text, 780) : [];
  s.enter?.();
  if (s.sfx) sfx[s.sfx]();
  else if (cine.i > 0) sfx.cut();
}

function nextShot() {
  cine.i++;
  if (cine.i >= cine.shots.length) { endScene(); return; }
  startShot();
}

function endScene() {
  clearInput();
  skipHold = 0;
  if (cine.name === 'finale') { game.state = 'final'; game.final = { t: 0 }; return; }
  const h = props.find(p => p.kind === 'henchman');
  if (h) h.dead = true;
  player.vx = 0;
  game.state = 'play';
  game.goArrow = 3;
}

function skipScene() {
  if (cine.name === 'finale') {
    if (player.state !== 'fallen') mantisStrike();
    mantis.state = 'pray';
    game.state = 'final'; game.final = { t: 0 };
    return;
  }
  endScene();
}

function updateCine(dt) {
  const s = cine.shots[cine.i];
  cine.t += dt;
  s.update?.(dt, cine.t);
  mantis.t += dt;
  if (mantis.state === 'strike') mantis.lunge = Math.min(1, mantis.t / 0.12);
  if (player.state === 'fallen') { player.t += dt; player.vx *= Math.exp(-6 * dt); player.x += player.vx * dt; }
  updateEffects(dt);
  if (s.kind === 'wide') camX = lerp(camX, cine.cam, 1 - Math.exp(-dt * 4));

  if (cine.text) {
    const before = Math.floor(cine.chars);
    cine.chars = Math.min(cine.text.length, cine.chars + dt * 34);
    if (Math.floor(cine.chars) > before && before % 2 === 0) sfx.tick();
  }
  // Cutscenes play like a film: no key or click advances them. Holding Esc for 5s skips.
  if (holdToSkip(dt)) { skipScene(); return; }
  const typed = !cine.text || cine.chars >= cine.text.length;
  const need = s.dur ?? (cine.text ? 1.8 + cine.text.length * 0.055 : 2);
  if (typed && cine.t >= need && (!s.until || s.until())) nextShot();
}

const SKIP_HOLD = 5;
let skipHold = 0;
function holdToSkip(dt) {
  skipHold = keys.pause ? skipHold + dt : 0;
  if (skipHold < SKIP_HOLD) return false;
  skipHold = 0;
  return true;
}
// Throw away anything pressed during a cutscene so it can't leak into the fight
function clearInput() { for (const a in pressed) pressed[a] = null; }

function drawSkipHint(y = VH - 18) {
  const touch = document.body.classList.contains('touch');
  ctx.textAlign = 'right'; ctx.font = '12px "Special Elite", monospace';
  ctx.fillStyle = skipHold > 0 ? '#cfcfcf' : '#555';
  ctx.fillText(touch ? 'hold II to skip' : 'hold ESC to skip', VW - 16, y);
  if (skipHold > 0) {
    ctx.fillStyle = '#333'; ctx.fillRect(VW - 130, y + 6, 114, 3);
    ctx.fillStyle = WHITE; ctx.fillRect(VW - 130, y + 6, 114 * Math.min(1, skipHold / SKIP_HOLD), 3);
  }
  ctx.textAlign = 'left';
}

function isTalking(who) {
  const s = cine.shots[cine.i];
  return !!(s && s.line && s.line.who === NAME[who] && cine.chars < cine.text.length);
}

  ctx.beginPath(); ctx.ellipse(-50, 56, 15, 26, 0.2, 0, Math.PI * 2); ctx.ellipse(50, 56, 15, 26, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-52, 28); ctx.quadraticCurveTo(-34, 38, -16, 28); ctx.moveTo(16, 28); ctx.quadraticCurveTo(34, 38, 52, 28); ctx.stroke();
  const r = seeded(99);
  ctx.fillStyle = '#4a4a4a';
  for (let i = 0; i < 90; i++) {
    const x = (r() - 0.5) * 110, y = 60 + r() * 50;
    if (Math.abs(x) < 60 - (y - 60) * 0.6 && !(y < 90 && Math.abs(x) < 18 && y > 66)) ctx.fillRect(x, y, 1.6, 1.6);
  }
  ctx.restore();
}

const FACES = {
  oranus:   { jaw: 1.04, lash: 0, browW: 1,   back: oranusHairBack, body: oranusCoat, front: oranusScarf, hair: oranusHairFront, mark: oranusScar },
  mantis:   { jaw: 0.9,  lash: 3, browW: 0.7, back: mantisHairBack, body: mantisShoulders, front: mantisNecklace, hair: mantisHairFront, lips: true, mole: true },
  henchman: { jaw: 1.08, lash: 0, browW: 1.1, back: hoodBack('#1a1a1a'), body: hoodieBody, hair: hoodFront('#1a1a1a'), overlay: crackedMask },
  oracle:   { jaw: 0.95, lash: 1, browW: 0.8, back: hoodBack('#222'), body: shawlBody, hair: oracleHoodFront, mark: wrinkles, cloudyRight: true },
  ghost:    { jaw: 0.9,  lash: 0, browW: 0.9, back: ghostHairBack, body: ragsBody, hair: ghostHairFront, mark: gauntLines },
};

function blinkAmount(seed) { return ((game.t + seed) % 3.7) < 0.12 ? 1 : 0; }

function drawEye(cx, cy, side, E, F) {
  const open = E.open;
  const h = 20 * open;
  const ix = cx - side * 21, ox = cx + side * 25;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (open < 0.14) {
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(ix, cy + 3); ctx.quadraticCurveTo(cx, cy + 9, ox + side * 2, cy + 1); ctx.stroke();
    return;
  }
  const upper = () => { ctx.moveTo(ix, cy + 3); ctx.bezierCurveTo(ix + side * 6, cy - h - 2, ox - side * 9, cy - h - 4, ox, cy - 3); };
  ctx.beginPath(); upper();
  ctx.bezierCurveTo(ox - side * 6, cy + h * 0.75, ix + side * 9, cy + h * 0.8, ix, cy + 3);
  ctx.closePath();
  ctx.fillStyle = E.shadow ? '#c4c4c4' : PAPER; ctx.fill();
  ctx.save(); ctx.clip();
  const small = E.iris === 'small';
  const irx = small ? 8 : 14, iry = small ? 10.5 : 19;
  const icx = cx + side, icy = cy + 1 + (E.look || 0);
  const kind = F.cloudyRight && side === 1 ? 'cloudy' : E.iris;
  const g = ctx.createLinearGradient(0, icy - iry, 0, icy + iry);
  if (kind === 'cloudy') { g.addColorStop(0, '#dedede'); g.addColorStop(1, '#a8a8a8'); }
  else if (kind === 'slit') { g.addColorStop(0, '#6a6a6a'); g.addColorStop(1, '#d4d4d4'); }
  else { g.addColorStop(0, INK); g.addColorStop(0.6, '#2c2c2c'); g.addColorStop(1, '#707070'); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(icx, icy, irx, iry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = INK;
  if (kind === 'slit') { ctx.beginPath(); ctx.ellipse(icx, icy, 2.4, iry * 0.85, 0, 0, Math.PI * 2); ctx.fill(); }
  else if (kind !== 'cloudy') {
    ctx.beginPath(); ctx.ellipse(icx, icy + 1, irx * 0.42, iry * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(242,242,242,0.18)'; ctx.lineWidth = 1;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(icx + Math.cos(a) * irx * 0.5, icy + Math.sin(a) * iry * 0.5); ctx.lineTo(icx + Math.cos(a) * irx * 0.9, icy + Math.sin(a) * iry * 0.9); ctx.stroke();
    }
  }
  if (E.shine !== false && kind !== 'cloudy') {
    ctx.fillStyle = PAPER;
    circle(icx - 4, icy - 6, E.shine === 'tiny' ? 1.8 : 4.6);
    if (E.shine !== 'tiny') circle(icx + 4.5, icy + 6, 2);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(cx - 30, cy - h - 8, 60, 7);
  ctx.restore();
  // Lids and lashes
  ctx.strokeStyle = INK; ctx.lineWidth = 5.2;
  ctx.beginPath(); ctx.moveTo(ix - side, cy + 2); ctx.bezierCurveTo(ix + side * 6, cy - h - 3, ox - side * 9, cy - h - 5, ox + side * 3, cy - 4); ctx.stroke();
  ctx.lineWidth = 2.6;
  for (let i = 0; i < (F.lash || 0); i++) {
    const sx = ox - side * i * 6, sy = cy - 4 - i * h * 0.22;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + side * (9 - i * 1.5), sy - 7 - i * 2); ctx.stroke();
  }
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(ox - side, cy); ctx.quadraticCurveTo(cx + side * 9, cy + h * 0.72, cx - side * 6, cy + h * 0.72); ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx - side * 8, cy - h - 9); ctx.quadraticCurveTo(cx + side * 8, cy - h - 12, ox - side, cy - h - 5); ctx.stroke();
}

function drawBrow(cx, cy, side, angle, w) {
  const ix = cx - side * 17, iy = cy + angle * 7;
  const ox = cx + side * 22, oy = cy - 2 - angle * 2.5;
  const mx = cx + side * 3, my = Math.min(iy, oy) - 5 - Math.max(0, -angle) * 3;
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(ix, iy - 3.2 * w);
  ctx.quadraticCurveTo(mx, my - 2 * w, ox, oy);
  ctx.quadraticCurveTo(mx, my + 4 * w, ix, iy + 3.2 * w);
  ctx.closePath(); ctx.fill();
}

function drawMouth(type, F) {
  ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  const line = draw => { ctx.beginPath(); draw(); ctx.stroke(); };
  switch (type) {
    case 'line': line(() => { ctx.moveTo(-11, 75); ctx.quadraticCurveTo(0, 77, 11, 74); }); break;
    case 'talk': ctx.beginPath(); ctx.ellipse(0, 76, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill(); break;
    case 'open': ctx.beginPath(); ctx.ellipse(0, 77, 6, 6, 0, 0, Math.PI * 2); ctx.fill(); break;
    case 'shock': ctx.beginPath(); ctx.ellipse(0, 78, 7.5, 11, 0, 0, Math.PI * 2); ctx.fill(); break;
    case 'shout':
      ctx.beginPath(); ctx.moveTo(-17, 68); ctx.quadraticCurveTo(0, 64, 17, 68); ctx.quadraticCurveTo(11, 96, 0, 97); ctx.quadraticCurveTo(-11, 96, -17, 68); ctx.fill();
      ctx.fillStyle = PAPER; ctx.fillRect(-12, 68, 24, 4);
      break;
    case 'smile': line(() => { ctx.moveTo(-15, 71); ctx.quadraticCurveTo(0, 81, 15, 71); }); break;
    case 'smirk': line(() => { ctx.moveTo(-12, 76); ctx.quadraticCurveTo(4, 78, 18, 68); }); break;
    case 'grin':
      line(() => { ctx.moveTo(-24, 67); ctx.quadraticCurveTo(-2, 86, 26, 63); ctx.moveTo(26, 63); ctx.lineTo(30, 58); });
      ctx.fillStyle = PAPER; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(8, 76); ctx.lineTo(14, 74); ctx.lineTo(11, 83); ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    case 'sad': line(() => { ctx.moveTo(-12, 79); ctx.quadraticCurveTo(0, 71, 12, 79); }); break;
    case 'grit':
      ctx.fillStyle = PAPER;
      ctx.beginPath(); ctx.moveTo(-15, 70); ctx.lineTo(15, 70); ctx.lineTo(12, 82); ctx.lineTo(-12, 82); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1.5;
      line(() => { ctx.moveTo(-14, 76); ctx.lineTo(14, 76); for (let i = -8; i <= 8; i += 8) { ctx.moveTo(i, 70); ctx.lineTo(i, 82); } });
      break;
  }
  if (F.lips && ['line', 'smile', 'smirk', 'grin'].includes(type)) {
    ctx.lineWidth = 1.6;
    line(() => { ctx.moveTo(-5, 86); ctx.quadraticCurveTo(0, 88, 5, 86); });
  }
}

function drawPortrait(who, exprName, x, y, s, o = {}) {
  const F = FACES[who], E = { ...EXPR[exprName] };
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  F.back?.();
  F.body?.();
  // Neck, with tone shading under the jaw
  ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-27, 60); ctx.lineTo(-25, 156); ctx.lineTo(25, 156); ctx.lineTo(27, 60); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-27, 60); ctx.lineTo(-25, 146); ctx.moveTo(27, 60); ctx.lineTo(25, 146); ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.rect(-27, 60, 54, 96); ctx.clip();
  ctx.globalAlpha = 0.6; ctx.fillStyle = dots(); ctx.beginPath(); ctx.ellipse(0, 96, 46, 30, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // Ears
  ctx.fillStyle = PAPER;
  for (const sd of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(sd * 70, 14, 9, 17, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(sd * 70, 14, 7, sd < 0 ? Math.PI * 0.6 : -Math.PI * 0.4, sd < 0 ? Math.PI * 1.4 : Math.PI * 0.4); ctx.stroke();
    ctx.lineWidth = 3;
  }
  // Face
  facePath(F.jaw);
  ctx.fillStyle = PAPER; ctx.fill(); ctx.lineWidth = 3.2; ctx.stroke();
  ctx.save(); facePath(F.jaw); ctx.clip();
  ctx.globalAlpha = 0.5; ctx.fillStyle = dots();
  ctx.beginPath(); ctx.moveTo(56, -130); ctx.quadraticCurveTo(46, 30, 62, 130); ctx.lineTo(120, 130); ctx.lineTo(120, -130); ctx.fill();
  ctx.globalAlpha = 1;
  F.mark?.();
  if (E.blush) {
    ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
    for (const sd of [-1, 1]) for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(sd * 44 - 8 + i * 6, 50); ctx.lineTo(sd * 44 - 2 + i * 6, 42); ctx.stroke(); }
  }
  if (E.shadow) {
    // The classic villain shadow across the upper face
    const g = ctx.createLinearGradient(0, -110, 0, 40);
    g.addColorStop(0, 'rgba(0,0,0,0.88)'); g.addColorStop(0.75, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(-120, -130, 240, 170);
  }
  ctx.restore();
  F.front?.();

  if (F.cloudyRight && E.shadow) {
    const g = ctx.createRadialGradient(34, 8, 4, 34, 8, 60);
    g.addColorStop(0, 'rgba(242,242,242,0.9)'); g.addColorStop(1, 'rgba(242,242,242,0)');
    ctx.fillStyle = g; ctx.fillRect(-30, -56, 128, 128);
  }

  // Eyes, nose, mouth
  const blink = o.noBlink ? 0 : blinkAmount(o.seed || 0);
  const closing = o.eyeClose ?? 0;
  const eyeE = { ...E, open: (E.open ?? 1) * (1 - blink) * (1 - closing) };
  if (E.happy && closing < 0.5) {
    ctx.strokeStyle = INK; ctx.lineWidth = 4.5;
    for (const cx of [-34, 34]) { ctx.beginPath(); ctx.moveTo(cx - 17, 14); ctx.quadraticCurveTo(cx, -2, cx + 17, 14); ctx.stroke(); }
  } else {
    drawEye(-34, 8, -1, eyeE, F);
    drawEye(34, 8, 1, eyeE, F);
  }
  ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(5, 30); ctx.quadraticCurveTo(1, 44, 8, 48); ctx.stroke();
  drawMouth(o.talking && Math.floor(game.t * 11) % 2 === 0 ? 'talk' : E.mouth, F);
  if (F.mole) { ctx.fillStyle = INK; circle(48, 34, 2.2); }

  F.hair?.();
  drawBrow(-34, -24, -1, E.brow, F.browW);
  drawBrow(34, -24, 1, E.brow, F.browW);
  F.overlay?.();

  if (E.sweat) {
    ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(62, -20); ctx.quadraticCurveTo(72, -2, 62, 4); ctx.quadraticCurveTo(52, -2, 62, -20); ctx.fill(); ctx.stroke();
  }
  if (E.veins) {
    ctx.strokeStyle = PAPER; ctx.lineWidth = 4;
    const vx = 62, vy = -72;
    ctx.beginPath();
    ctx.arc(vx - 7, vy - 7, 6, 0, Math.PI / 2); ctx.moveTo(vx + 7 - 6, vy - 7); ctx.arc(vx + 7, vy - 7, 6, Math.PI / 2, Math.PI);
    ctx.moveTo(vx - 7 + 6, vy + 7); ctx.arc(vx - 7, vy + 7, 6, 0, -Math.PI / 2, true); ctx.moveTo(vx + 7, vy + 1); ctx.arc(vx + 7, vy + 7, 6, -Math.PI / 2, Math.PI, true);
    ctx.stroke();
  }
  if (E.blood) {
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(6, 80); ctx.quadraticCurveTo(12, 94, 10, 110); ctx.stroke();
    ctx.fillStyle = INK; circle(10, 114, 3.5);
  }
  ctx.restore();
}

// ---- Cutscene backgrounds ----
function focusLines(cx, cy, inner, color, count, seed) {
  const r = seeded(seed);
  ctx.fillStyle = color;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + r() * 0.05;
    const w = 0.004 + r() * 0.012, rin = inner * (0.85 + r() * 0.5), rout = 1300;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * rin, cy + Math.sin(a) * rin);
    ctx.lineTo(cx + Math.cos(a - w) * rout, cy + Math.sin(a - w) * rout);
    ctx.lineTo(cx + Math.cos(a + w) * rout, cy + Math.sin(a + w) * rout);
    ctx.closePath(); ctx.fill();
  }
}
const BG = {
  tone: () => {
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, '#3a3a3a'); g.addColorStop(1, '#0e0e0e');
    ctx.fillStyle = g; ctx.fillRect(-80, -80, VW + 160, VH + 160);
    ctx.globalAlpha = 0.35; ctx.fillStyle = dots(); ctx.fillRect(-80, -80, VW + 160, VH + 160); ctx.globalAlpha = 1;
    const r = ctx.createRadialGradient(VW / 2, VH * 0.45, 20, VW / 2, VH * 0.45, 380);
    r.addColorStop(0, 'rgba(242,242,242,0.22)'); r.addColorStop(1, 'rgba(242,242,242,0)');
    ctx.fillStyle = r; ctx.fillRect(-80, -80, VW + 160, VH + 160);
  },
  dark: () => {
    ctx.fillStyle = '#050505'; ctx.fillRect(-80, -80, VW + 160, VH + 160);
    const r = ctx.createRadialGradient(VW * 0.8, VH * 0.2, 10, VW * 0.8, VH * 0.2, 520);
    r.addColorStop(0, 'rgba(242,242,242,0.16)'); r.addColorStop(1, 'rgba(242,242,242,0)');
    ctx.fillStyle = r; ctx.fillRect(-80, -80, VW + 160, VH + 160);
  },
  rain: () => {
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, '#2a2a2a'); g.addColorStop(1, '#070707');
    ctx.fillStyle = g; ctx.fillRect(-80, -80, VW + 160, VH + 160);
    for (let i = 0; i < 5; i++) {
      const x = ((i * 233 + game.t * 8) % (VW + 200)) - 100;
      const sg = ctx.createLinearGradient(x - 40, 0, x + 40, 0);
      sg.addColorStop(0, 'rgba(242,242,242,0)'); sg.addColorStop(0.5, 'rgba(242,242,242,0.06)'); sg.addColorStop(1, 'rgba(242,242,242,0)');
      ctx.fillStyle = sg; ctx.fillRect(x - 40, -80, 80, VH + 160);
    }
    drawRain(2);
  },
  focus: () => {
    ctx.fillStyle = PAPER; ctx.fillRect(-80, -80, VW + 160, VH + 160);
    focusLines(VW / 2, VH / 2, 240, INK, 120, Math.floor(game.t / 0.08) + 1);
  },
  speed: () => {
    ctx.fillStyle = '#0c0c0c'; ctx.fillRect(-80, -80, VW + 160, VH + 160);
    ctx.fillStyle = PAPER;
    for (let i = 0; i < 70; i++) {
      const y = (i * 97.3) % VH, len = 120 + (i * 53) % 380;
      const x = (((i * 211 - game.t * 2600) % (VW + 600)) + VW + 600) % (VW + 600) - 300;
      ctx.globalAlpha = 0.2 + (i % 4) * 0.12;
      ctx.fillRect(x, y, len, 1 + (i % 3));
    }
    ctx.globalAlpha = 1;
  },
  flash: t => {
    const v = Math.round(lerp(242, 6, clamp(t / 1.4, 0, 1)));
    ctx.fillStyle = `rgb(${v},${v},${v})`; ctx.fillRect(-80, -80, VW + 160, VH + 160);
  },
};

function drawFaceShot(s, t) {
  BG[s.bg || 'tone'](t);
  const x = s.side === 'left' ? VW * 0.34 : s.side === 'right' ? VW * 0.66 : VW / 2;
  drawPortrait(s.who, s.expr, x, VH * 0.5 - 18, s.scale || 1.32, {
    talking: isTalking(s.who), seed: s.who.length,
    eyeClose: s.close ? clamp((t - 1.4) / 1.2, 0, 1) : 0,
  });
}

function drawEyesShot(s, t) {
  BG[s.bg || 'tone'](t);
  const sc = 3.6, top = VH * 0.26, bot = VH * 0.74;
  ctx.save();
  ctx.beginPath(); ctx.rect(-80, top, VW + 160, bot - top); ctx.clip();
  drawPortrait(s.who, s.expr, VW / 2, VH / 2 - 8 * sc + 10, sc, { noBlink: true });
  ctx.restore();
  ctx.fillStyle = '#000';
  ctx.fillRect(-80, -80, VW + 160, top + 80); ctx.fillRect(-80, bot, VW + 160, VH - bot + 80);
}

function drawSplitShot(s, t) {
  const A = [[-80, -80], [VW * 0.57, -80], [VW * 0.43, VH + 80], [-80, VH + 80]];
  const B = [[VW * 0.57, -80], [VW + 80, -80], [VW + 80, VH + 80], [VW * 0.43, VH + 80]];
  for (const [poly, side, x] of [[A, s.left, VW * 0.26], [B, s.right, VW * 0.74]]) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(...poly[0]); for (const p of poly.slice(1)) ctx.lineTo(...p); ctx.closePath(); ctx.clip();
    BG[side.bg || 'tone'](t);
    drawPortrait(side.who, side.expr, x, VH * 0.5 - 14, 1.18, { talking: isTalking(side.who), seed: side.who.length });
    ctx.restore();
  }
  ctx.strokeStyle = PAPER; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(VW * 0.57 + 4, -80); ctx.lineTo(VW * 0.43 - 4, VH + 80); ctx.stroke();
}

function drawImpact(s, t) {
  const inv = t < 0.4 && Math.floor(t * 14) % 2 === 0;
  const bg = inv ? INK : PAPER, fg = inv ? PAPER : INK;
  ctx.fillStyle = bg; ctx.fillRect(-80, -80, VW + 160, VH + 160);
  focusLines(VW / 2, VH / 2, 70, fg, 170, Math.floor(t / 0.05) + 3);
  // Claw slashes tearing across the frame
  ctx.fillStyle = fg;
  for (let i = 0; i < 3; i++) {
    const off = (i - 1) * 70;
    ctx.beginPath();
    ctx.moveTo(-60 + off, VH * 0.9);
    ctx.quadraticCurveTo(VW * 0.45 + off, VH * 0.42 - i * 10, VW + 60 + off, VH * 0.06);
    ctx.quadraticCurveTo(VW * 0.47 + off, VH * 0.5 - i * 10, -60 + off, VH * 0.9);
    ctx.fill();
  }
  ctx.save();
  ctx.translate(VW / 2, VH / 2); ctx.rotate(-0.12);
  const k = 1 + Math.max(0, 0.3 - t) * 2;
  ctx.scale(k, k);
  ctx.font = '900 150px Cinzel, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 16; ctx.strokeStyle = bg; ctx.strokeText(s.text, 0, 0);
  ctx.fillStyle = fg; ctx.fillText(s.text, 0, 0);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function drawCine() {
  const s = cine.shots[cine.i], t = cine.t;
  ctx.save();
  const z = 1 + t * (s.zoom ?? 0.025);
  const sh = (s.shake || 0) * Math.max(0, 1 - t / 1.2) + game.shake;
  ctx.translate(VW / 2 + rand(-sh, sh), VH / 2 + rand(-sh, sh));
  ctx.scale(z, z);
  ctx.translate(-VW / 2, -VH / 2);
  switch (s.kind) {
    case 'wide': drawWorld(); break;
    case 'face': drawFaceShot(s, t); break;
    case 'eyes': drawEyesShot(s, t); break;
    case 'split': drawSplitShot(s, t); break;
    case 'impact': drawImpact(s, t); break;
  }
  ctx.restore();

  if (s.kind !== 'impact') {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, VW, 46); ctx.fillRect(0, VH - 46, VW, 46);
  }
  // Subtitles, anime style: centered, outlined, typed out
  if (cine.text) {
    let left = Math.floor(cine.chars);
    const shown = cine.lines.map(l => { const part = l.slice(0, Math.max(0, left)); left -= l.length + 1; return part; });
    const baseY = VH - 66 - (cine.lines.length - 1) * 26;
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.font = '700 13px Cinzel, serif';
    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.fillStyle = '#bdbdbd';
    ctx.strokeText(s.line.who, VW / 2, baseY - 26); ctx.fillText(s.line.who, VW / 2, baseY - 26);
    ctx.font = '21px "Special Elite", monospace';
    ctx.lineWidth = 5; ctx.fillStyle = WHITE;
    shown.forEach((l, i) => { if (!l) return; ctx.strokeText(l, VW / 2, baseY + i * 26); ctx.fillText(l, VW / 2, baseY + i * 26); });
  }
  drawSkipHint();
  if (t < 0.12 && s.kind !== 'impact') { ctx.fillStyle = `rgba(0,0,0,${1 - t / 0.12})`; ctx.fillRect(0, 0, VW, VH); }
}

// =====================================================================
//  Drawing: realistic silhouette characters
// =====================================================================
const LOOKS = {
  oranus:  { scale: 1,    bulk: 1,    hair: 'spiky', coat: true, scarf: true },
  grunt:   { scale: 1,    bulk: 1,    hood: 'short', mask: true },
  thrower: { scale: 0.97, bulk: 0.88, hood: 'long', mask: true },
  guard:   { scale: 1.04, bulk: 1.1,  helmet: true, shield: true },
  brute:   { scale: 1.27, bulk: 1.32, pads: true, mask: true },
  warden:  { scale: 1.5,  bulk: 1.4,  pads: true, horns: true, cape: true, eyesGlow: true },
  mantis:  { scale: 0.95, bulk: 0.82, hair: 'long', dress: WHITE },
  oracle:  { scale: 0.92, bulk: 0.9,  hood: 'short', robe: true },
  ghost:   { scale: 0.98, bulk: 0.82, hair: 'long' },
};

function joint(x, y, a1, a2, l1, l2, face) {
  const kx = x + Math.sin(a1) * l1 * face, ky = y + Math.cos(a1) * l1;
  const ex = kx + Math.sin(a1 + a2) * l2 * face, ey = ky + Math.cos(a1 + a2) * l2;
  return { kx, ky, ex, ey };
}

// Angles are measured from straight down; positive swings toward the facing direction
function skeleton(pose, face) {
  const lean = pose.lean || 0;
  const hip = { x: 0, y: -64 + (pose.bob || 0) };
  const ux = Math.sin(lean) * face, uy = -Math.cos(lean);
  const chest = { x: ux * 44, y: hip.y + uy * 44 };
  const sh = { x: ux * 38, y: hip.y + uy * 38 };
  const ha = lean * 0.6 + (pose.head || 0);
  const head = { x: chest.x + Math.sin(ha) * face * 19, y: chest.y - Math.cos(ha) * 19 };
  const shF = { x: sh.x + face * 2, y: sh.y }, shB = { x: sh.x - face * 3, y: sh.y };
  const hipF = { x: face * 2, y: hip.y }, hipB = { x: -face * 2, y: hip.y };
  return {
    lean, hip, chest, sh, head, shF, shB, hipF, hipB, ux, uy,
    legF: joint(hipF.x, hipF.y, pose.legF[0], pose.legF[1], 33, 33, face),
    legB: joint(hipB.x, hipB.y, pose.legB[0], pose.legB[1], 33, 33, face),
    armF: joint(shF.x, shF.y, pose.armF[0], pose.armF[1], 26, 25, face),
    armB: joint(shB.x, shB.y, pose.armB[0], pose.armB[1], 26, 25, face),
  };
}

function drawLeg(h, j, k, face) {
  capsule(h.x, h.y, 9 * k, j.kx, j.ky, 6.5 * k);
  capsule(j.kx, j.ky, 6.5 * k, j.ex, j.ey, 4.6 * k);
  capsule(j.ex, j.ey, 4.6 * k, j.ex + face * 13 * k, j.ey + 1.5, 3.4 * k);
}
function drawArm(s, j, k) {
  capsule(s.x, s.y, 6 * k, j.kx, j.ky, 4.8 * k);
  capsule(j.kx, j.ky, 4.8 * k, j.ex, j.ey, 3.8 * k);
  circle(j.ex + (j.ex - j.kx) * 0.12, j.ey + (j.ey - j.ky) * 0.12, 5 * k);
}

function shieldAt(sk, face, k) {
  ctx.translate(sk.armF.ex + face * 5, sk.armF.ey - 6);
  ctx.rotate(face * 0.08);
}

function silhouette(sk, L, face, main, back, opts) {
  const k = L.bulk || 1, h = sk.head;
  ctx.fillStyle = back;
  drawArm(sk.shB, sk.armB, k);
  drawLeg(sk.hipB, sk.legB, k, face);
  ctx.fillStyle = main;

  if (L.cape) {
    const fl = Math.sin(game.t * 4) * 4;
    ctx.beginPath();
    ctx.moveTo(sk.sh.x - face * 10 * k, sk.sh.y - 4);
    ctx.quadraticCurveTo(sk.hip.x - face * 30, sk.hip.y + 10, sk.hip.x - face * (34 + fl), 0);
    ctx.lineTo(sk.hip.x - face * 6, 0);
    ctx.lineTo(sk.sh.x + face * 4, sk.sh.y);
    ctx.closePath(); ctx.fill();
  }
  if (L.hair === 'long') {
    const sway = Math.sin(game.t * 2.5) * 3;
    ctx.beginPath();
    ctx.moveTo(h.x + face * 6, h.y - 10);
    ctx.quadraticCurveTo(h.x - face * 4, h.y - 16, h.x - face * 12, h.y - 4);
    ctx.quadraticCurveTo(h.x - face * 19 + sway, h.y + 30, h.x - face * 17 + sway, h.y + 58);
    ctx.lineTo(h.x - face * 4 + sway, h.y + 52);
    ctx.quadraticCurveTo(h.x - face * 2, h.y + 20, h.x + face * 4, h.y + 4);
    ctx.closePath(); ctx.fill();
  }
  if (L.coat) {
    // Long coat tails flare out behind when running
    const sp = clamp(Math.abs(opts.vx || 0) / 280, 0, 1);
    const fl = Math.sin(game.t * 9) * (2 + sp * 5);
    const w = sk.hip, top = { x: w.x + sk.ux * 10, y: w.y + sk.uy * 10 };
    ctx.beginPath();
    ctx.moveTo(top.x + face * 12 * k, top.y);
    ctx.lineTo(top.x - face * 13 * k, top.y);
    ctx.quadraticCurveTo(w.x - face * (20 + sp * 18), w.y + 24, w.x - face * (24 + sp * 34) + fl, w.y + 50 - sp * 8);
    ctx.lineTo(w.x - face * (4 + sp * 10), w.y + 54);
    ctx.lineTo(w.x + face * 12 * k, w.y + 40);
    ctx.closePath(); ctx.fill();
  }

  capsule(sk.hip.x, sk.hip.y, 11 * k, sk.chest.x, sk.chest.y, 14.5 * k);
  if (L.pads) { circle(sk.shF.x, sk.shF.y, 11 * k); circle(sk.shB.x, sk.shB.y, 10 * k); }
  if (L.coat) {
    ctx.beginPath();
    ctx.moveTo(sk.chest.x - face * 6, sk.chest.y + 2); ctx.lineTo(sk.chest.x - face * 11, sk.chest.y - 11); ctx.lineTo(sk.chest.x + face * 3, sk.chest.y - 1);
    ctx.closePath(); ctx.fill();
  }

  drawLeg(sk.hipF, sk.legF, k, face);
  if (L.robe) {
    ctx.beginPath();
    ctx.moveTo(sk.chest.x - 12, sk.chest.y + 6); ctx.lineTo(sk.chest.x + 12, sk.chest.y + 6);
    ctx.lineTo(sk.hip.x + face * 40, Math.min(sk.hip.y + 66, 34)); ctx.lineTo(sk.hip.x - face * 22, Math.min(sk.hip.y + 66, 34));
    ctx.closePath(); ctx.fill();
  }

  capsule(sk.chest.x, sk.chest.y, 5 * k, h.x, h.y + 6, 4.5 * k);
  ctx.beginPath(); ctx.ellipse(h.x, h.y, 9.5 * k, 11.5 * k, sk.lean * face * 0.5, 0, Math.PI * 2); ctx.fill();
  circle(h.x + face * 4 * k, h.y + 6 * k, 5.5 * k);

  if (L.hair === 'spiky') {
    const pts = [[-11, -2], [-20, -6], [-12, -10], [-19, -18], [-8, -15], [-6, -23], [2, -16], [9, -20], [9, -12], [14, -9], [8, -5]];
    ctx.beginPath(); ctx.moveTo(h.x + face * pts[0][0] * k, h.y + pts[0][1] * k);
    for (const [px, py] of pts.slice(1)) ctx.lineTo(h.x + face * px * k, h.y + py * k);
    ctx.closePath(); ctx.fill();
  }
  if (L.hood) {
    ctx.beginPath(); ctx.ellipse(h.x - face * 1.5, h.y - 1, 12.5 * k, 14 * k, 0, 0, Math.PI * 2); ctx.fill();
    const long = L.hood === 'long';
    ctx.beginPath();
    ctx.moveTo(h.x - face * 8 * k, h.y - 10 * k);
    ctx.lineTo(h.x - face * (long ? 28 : 17) * k, h.y + (long ? 20 + Math.sin(game.t * 6) * 3 : 4) * k);
    ctx.lineTo(h.x - face * 10 * k, h.y + 8 * k);
    ctx.closePath(); ctx.fill();
  }
  if (L.helmet) {
    ctx.beginPath(); ctx.arc(h.x, h.y - 1, 12 * k, Math.PI, 0); ctx.lineTo(h.x + face * 13 * k, h.y + 4); ctx.lineTo(h.x - face * 13 * k, h.y + 4); ctx.closePath(); ctx.fill();
  }
  if (L.horns) {
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(h.x + s * 6, h.y - 9); ctx.quadraticCurveTo(h.x + s * 15, h.y - 20, h.x + s * 6, h.y - 30); ctx.lineTo(h.x + s * 3, h.y - 10);
      ctx.closePath(); ctx.fill();
    }
  }

  drawArm(sk.shF, sk.armF, k);
  if (L.shield) {
    ctx.save(); shieldAt(sk, face, k);
    ctx.fillRect(-7 * k, -36 * k, 14 * k, 72 * k);
    ctx.restore();
  }
}

function details(sk, L, face, opts) {
  const h = sk.head, k = L.bulk || 1;
  const light = opts.flash ? INK : WHITE;
  if (L.scarf) {
    const sp = clamp(Math.abs(opts.vx || 0) / 280, 0, 1);
    ctx.fillStyle = WHITE;
    ctx.beginPath(); ctx.ellipse(sk.chest.x, sk.chest.y - 3, 9, 5, sk.lean * face, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = WHITE; ctx.lineCap = 'round';
    // Hangs down like cloth when still, streams out behind when running
    let px = sk.chest.x - face * 4, py = sk.chest.y - 2;
    for (let i = 1; i <= 10; i++) {
      const sway = Math.sin(game.t * (4 + sp * 6) - i * 0.7) * (1.2 + i * 0.25) * (0.6 + sp);
      const nx = px - face * lerp(2.2, 7.5, sp) + sway * 0.4;
      const ny = py + lerp(5.2, 1.2, sp) + sway * 0.3;
      ctx.lineWidth = Math.max(2, 8 - i * 0.55);
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(nx, ny); ctx.stroke();
      px = nx; py = ny;
    }
  }
  if (L.dress) {
    const w = { x: sk.hip.x + sk.ux * 14, y: sk.hip.y + sk.uy * 14 };
    const sway = Math.sin(game.t * 2) * 2, bottom = Math.min(sk.hip.y + 60, 2);
    ctx.fillStyle = opts.flash ? INK : L.dress;
    ctx.beginPath();
    ctx.moveTo(w.x - 9, w.y); ctx.lineTo(w.x + 9, w.y);
    ctx.quadraticCurveTo(sk.hip.x + 17, sk.hip.y + 30, sk.hip.x + 25 + sway, bottom);
    ctx.lineTo(sk.hip.x - 25 + sway, bottom);
    ctx.quadraticCurveTo(sk.hip.x - 17, sk.hip.y + 30, w.x - 9, w.y);
    ctx.closePath(); ctx.fill();
    capsule(w.x, w.y, 9, sk.chest.x, sk.chest.y + 6, 10.5);
    ctx.strokeStyle = '#7a7a7a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sk.hip.x - 8, sk.hip.y + 8); ctx.lineTo(sk.hip.x - 12 + sway, bottom - 2); ctx.moveTo(sk.hip.x + 6, sk.hip.y + 8); ctx.lineTo(sk.hip.x + 12 + sway, bottom - 2); ctx.stroke();
  }
  ctx.strokeStyle = light; ctx.lineCap = 'round';
  if (L.mask) {
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(h.x + face * 1, h.y - 2); ctx.lineTo(h.x + face * 8.5, h.y - 3.5); ctx.stroke();
  }
  if (L.helmet) {
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(h.x - face * 2, h.y - 1); ctx.lineTo(h.x + face * 11, h.y - 1); ctx.stroke();
  }
  if (L.eyesGlow) {
    ctx.fillStyle = light;
    circle(h.x + face * 4, h.y - 2, 1.8); circle(h.x + face * 8.5, h.y - 2.5, 1.6);
    ctx.lineWidth = 1.2; ctx.strokeStyle = '#8a8a8a';
    ctx.beginPath(); ctx.moveTo(sk.chest.x - 10, sk.chest.y + 8); ctx.quadraticCurveTo(sk.chest.x, sk.chest.y + 14, sk.chest.x + 10, sk.chest.y + 8);
    ctx.moveTo(sk.chest.x - 9, sk.chest.y + 18); ctx.quadraticCurveTo(sk.chest.x, sk.chest.y + 24, sk.chest.x + 9, sk.chest.y + 18); ctx.stroke();
  }
  if (L.shield) {
    ctx.save(); shieldAt(sk, face, k);
    ctx.strokeStyle = '#9a9a9a'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-7 * k, -36 * k, 14 * k, 72 * k);
    ctx.fillStyle = '#9a9a9a'; circle(0, 0, 2.5 * k);
    ctx.restore();
  }
  if (opts.claws) {
    ctx.strokeStyle = WHITE; ctx.lineWidth = 2.5;
    for (const arm of [sk.armF, sk.armB]) {
      const ang = Math.atan2(arm.ey - arm.ky, arm.ex - arm.kx);
      for (let i = 1; i <= 4; i++) {
        const t = i / 5, x = lerp(arm.kx, arm.ex, t), y = lerp(arm.ky, arm.ey, t);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang + Math.PI / 2) * 8, y + Math.sin(ang + Math.PI / 2) * 8); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(arm.ex, arm.ey);
      ctx.lineTo(arm.ex + Math.cos(ang) * 16, arm.ey + Math.sin(ang) * 16);
      ctx.lineTo(arm.ex + Math.cos(ang) * 16 + Math.cos(ang + 2.4) * 9, arm.ey + Math.sin(ang) * 16 + Math.sin(ang + 2.4) * 9);
      ctx.stroke();
    }
  }
}

// Two passes: a light copy nudged toward the moon, then the black body on top,
// which leaves a thin rim of moonlight along the figure's edge
function drawFigure(x, y, face, pose, look, opts = {}) {
  const s = look.scale;
  const sk = skeleton(pose, face);
  ctx.save();
  if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
  for (let pass = 0; pass < 2; pass++) {
    ctx.save();
    ctx.translate(x + (pass === 0 ? 1.8 : 0), y + (pass === 0 ? -1.4 : 0));
    if (pose.rot) {
      const cy = (pose.rotY || 0) * s;
      ctx.translate(0, cy); ctx.rotate(pose.rot * face); ctx.translate(0, -cy);
    }
    ctx.scale(s, s);
    ctx.lineJoin = 'round';
    // The warning glow goes on the light pass, so the black body on top stays clean
    if (pass === 0 && opts.glow) { ctx.shadowColor = WHITE; ctx.shadowBlur = 22; }
    const main = opts.flash ? WHITE : pass === 0 ? (opts.glow ? WHITE : RIM) : BODY;
    const back = opts.flash ? WHITE : pass === 0 ? (opts.glow ? WHITE : RIM) : BACK;
    silhouette(sk, look, face, main, back, opts);
    if (pass === 1) { ctx.shadowBlur = 0; details(sk, look, face, opts); }
    ctx.restore();
  }
  ctx.restore();
  return sk;
}

// ---- Poses ----
const P = {
  idle: t => ({ lean: 0.06, bob: Math.sin(t * 3) * 1.4, armF: [0.5, 1.9], armB: [0.3, 2.1], legF: [0.22, -0.12], legB: [-0.18, -0.06] }),
  run: t => {
    const ph = t * 12, s = Math.sin(ph);
    return {
      lean: 0.22, bob: -Math.abs(Math.cos(ph)) * 4,
      armF: [-s * 0.9 + 0.2, 1.4], armB: [s * 0.9 + 0.2, 1.4],
      legF: [s * 0.75, -0.2 - Math.max(0, -Math.cos(ph)) * 1.1],
      legB: [-s * 0.75, -0.2 - Math.max(0, Math.cos(ph)) * 1.1],
    };
  },
  air: () => ({ lean: 0.1, armF: [2.2, 0.6], armB: [1.8, 0.8], legF: [0.9, -1.4], legB: [0.1, -0.9] }),
  hurt: () => ({ lean: -0.35, head: -0.3, armF: [-0.6, 0.4], armB: [-0.9, 0.6], legF: [0.3, -0.2], legB: [-0.3, -0.1] }),
  limp: () => ({ lean: 0, armF: [0.3, 0.2], armB: [-0.3, 0.3], legF: [0.1, -0.05], legB: [-0.1, -0.05] }),
  tuck: () => ({ lean: 0.4, bob: 26, armF: [1.4, 1.6], armB: [1.2, 1.8], legF: [1.6, -2.4], legB: [1.3, -2.2] }),
  kneel: () => ({ lean: 0.18, bob: 43, armF: [-0.5, 0.5], armB: [-0.6, 0.4], legF: [1.0, -2.5], legB: [0.3, -1.8] }),
  sit: t => ({ lean: 0.05, bob: 62, head: 0.15, armF: [0.9, 0.5 + Math.sin(t) * 0.05], armB: [0.8, 0.6], legF: [1.55, -1.55], legB: [1.45, -1.45] }),
  stand: t => ({ lean: 0.02, bob: Math.sin(t * 2) * 1, armF: [0.15, 0.3], armB: [-0.1, 0.3], legF: [0.06, -0.02], legB: [-0.06, -0.02] }),
  // Mantis forelegs: upper arm thrust forward, forearm folded back down beneath it
  pray: t => ({ lean: 0.12, bob: Math.sin(t * 3) * 1, armF: [1.85 + Math.sin(t * 4) * 0.05, 2.75], armB: [1.6, 2.8], legF: [0.06, -0.02], legB: [-0.06, -0.02] }),
  strike: () => ({ lean: 0.55, armF: [1.65, 0.05], armB: [1.5, 0.1], legF: [0.7, -0.2], legB: [-0.6, -0.1] }),
};

function playerPose(p) {
  const t = game.t;
  switch (p.state) {
    case 'light': {
      const a = ATK.light[p.combo], u = p.t / a.dur;
      const r = u < 0.3 ? u / 0.3 : u < 0.6 ? 1 : 1 - (u - 0.6) / 0.4;
      if (p.combo === 2) {
        return { lean: -0.2 * r, armF: [0.6, 1.8], armB: [0.2, 2], legF: [lerp(0.2, 1.55, r), lerp(-0.1, 0, r)], legB: [-0.2, -0.1] };
      }
      const punch = [lerp(0.6, 1.6, r), lerp(1.9, 0, r)], guard = [0.4, 2.0];
      const base = { lean: 0.15 + r * 0.15, legF: [0.35, -0.15], legB: [-0.3, -0.05] };
      return p.combo === 0 ? { ...base, armF: punch, armB: guard } : { ...base, armF: guard, armB: punch };
    }
    case 'heavy': {
      const u = p.t / ATK.heavy.dur;
      if (u < 0.5) {
        const k = u / 0.5;
        return { lean: lerp(0.06, -0.25, k), armF: [lerp(0.5, 3.0, k), lerp(1.9, 0.3, k)], armB: [lerp(0.3, 2.8, k), lerp(2.1, 0.4, k)], legF: [0.3, -0.15], legB: [-0.3, -0.05] };
      }
      const k = clamp((u - 0.5) / 0.2, 0, 1);
      return { lean: lerp(-0.25, 0.5, k), armF: [lerp(3.0, 1.2, k), lerp(0.3, 0, k)], armB: [lerp(2.8, 1.0, k), 0.1], legF: [0.5, -0.25], legB: [-0.4, -0.05] };
    }
    case 'dodge': return { ...P.tuck(), rot: (p.t / 0.36) * Math.PI * 2, rotY: -40 };
    case 'hurt': return P.hurt();
    case 'dying': case 'fallen': return { ...P.limp(), rot: -Math.PI / 2 * Math.min(1, p.t / 0.4) };
  }
  if (!p.onGround) return P.air();
  if (Math.abs(p.vx) > 10) return P.run(t);
  return P.idle(t);
}

function enemyPose(e) {
  const t = game.t + e.seed;
  if (e.dead) return { ...P.limp(), rot: -Math.PI / 2 * Math.min(1, e.deadT / 0.35) };
  const shieldUp = e.T.shield ? { armF: [1.25, 0.55] } : {};
  const u = e.state === 'windup' ? Math.min(1, e.t / e.wind) : 1;
  if (e.state === 'windup') {
    if (e.kind === 'throw') return { lean: -0.1, armF: [lerp(0.4, -2.3, u), 0.6], armB: [0.5, 1.5], legF: [0.3, -0.1], legB: [-0.3, -0.05] };
    if (e.kind === 'dash') return { lean: 0.5, armF: [-1.0, 0.5], armB: [-1.2, 0.5], legF: [0.8, -0.6], legB: [-0.7, -0.3] };
    if (e.kind === 'slam') return { lean: -0.2 * u, armF: [lerp(0.5, 2.9, u), 0.3], armB: [lerp(0.3, 2.7, u), 0.4], legF: [0.35, -0.15], legB: [-0.35, -0.05] };
    return { lean: -0.12 * u, armF: [lerp(0.5, -0.8, u), 1.7], armB: e.T.shield ? [0.4, 2.0] : [0.4, 2.0], legF: [0.3, -0.1], legB: [-0.3, -0.05] };
  }
  if (e.state === 'attack') {
    if (e.kind === 'throw') return { lean: 0.25, armF: [1.4, 0.2], armB: [0.2, 1.5], legF: [0.4, -0.1], legB: [-0.4, -0.05] };
    if (e.kind === 'dash') return { ...P.run(t * 1.6), lean: 0.6, armF: [1.5, 0], armB: [1.3, 0.1] };
    if (e.kind === 'slam') return { lean: 0.45, armF: [1.0, 0], armB: [0.9, 0.1], legF: [0.5, -0.25], legB: [-0.4, -0.05] };
    return { lean: 0.3, armF: [1.6, 0], armB: [0.3, 2.0], legF: [0.45, -0.15], legB: [-0.35, -0.05] };
  }
  if (e.state === 'hurt') return P.hurt();
  if (Math.abs(e.vx) > 5) return { ...P.run(t * (e.T.speed / 150)), ...shieldUp };
  return { ...P.idle(t), ...shieldUp };
}

function mantisPose() {
  switch (mantis.state) {
    case 'bound': return P.kneel();
    case 'stand': return P.stand(game.t);
    case 'pray': return P.pray(game.t);
    case 'strike': return P.strike();
  }
}

// =====================================================================
//  Drawing: world
// =====================================================================
const FAR = (() => {
  const r = seeded(7), out = [];
  for (let x = -100; x < LEVEL_END * 0.15 + VW + 200; x += r() * 60 + 40) out.push({ x, w: r() * 70 + 40, h: r() * 120 + 60 });
  return out;
})();

const MID = (() => {
  const r = seeded(42), out = [];
  const zoneAt = wx => ZONES.reduce((z, cur, i) => (wx >= cur.x ? i : z), 0);
  for (let lx = -50; lx < LEVEL_END * 0.45 + VW; lx += r() * 140 + 110) {
    const z = zoneAt(lx / 0.45);
    const kinds = [['tree', 'fence', 'tree'], ['stall', 'house', 'stall'], ['pylon', 'pylon', 'post'], ['pillar', 'house', 'pillar']][z];
    out.push({ x: lx, kind: kinds[Math.floor(r() * kinds.length)], w: r() * 60 + 60, h: r() * 80 + 90, seed: r() });
  }
  return out;
})();

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#121212'); g.addColorStop(0.55, '#2c2c2c'); g.addColorStop(1, '#7e7e7e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, GROUND);
  const mx = 760 - camX * 0.02, my = 105;
  const halo = ctx.createRadialGradient(mx, my, 30, mx, my, 170);
  halo.addColorStop(0, 'rgba(242,242,242,0.2)'); halo.addColorStop(1, 'rgba(242,242,242,0)');
  ctx.fillStyle = halo; ctx.fillRect(mx - 170, my - 170, 340, 340);
  ctx.fillStyle = '#ececec'; circle(mx, my, 40);
  ctx.fillStyle = 'rgba(0,0,0,0.08)'; circle(mx - 12, my - 8, 9); circle(mx + 10, my + 12, 6); circle(mx + 14, my - 14, 4);
  ctx.fillStyle = 'rgba(18,18,18,0.6)';
  for (let i = 0; i < 4; i++) {
    const x = (((i * 310 - camX * 0.03 - game.t * 6) % (VW + 500)) + VW + 500) % (VW + 500) - 250;
    ctx.beginPath(); ctx.ellipse(x, 70 + i * 36, 230, 8, 0, 0, Math.PI * 2); ctx.fill();
